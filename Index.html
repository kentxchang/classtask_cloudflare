    return '<div onclick="openTaskPlayer(\'' + t.id + '\')" class="card card-hover anim-pop p-5 cursor-pointer border-l-8 ' + (t.status === '退回' ? 'border-red-400' : t.status === '已完成' ? 'border-green-400' : t.status === '待批改' ? 'border-orange-400' : 'border-slate-200') + '" style="animation-delay:' + (idx * 0.06) + 's">' +
      '<div class="flex justify-between items-start mb-2">' +
        '<div class="flex items-center gap-2">' +
          '<span class="order-badge w-6 h-6 rounded-full flex items-center justify-center text-xs flex-shrink-0">' + (idx + 1) + '</span>' +
          '<div class="text-3xl">' + meta.icon + '</div>' +
        '</div>' +
        '<span class="status-' + t.status + ' text-xs font-black px-2.5 py-1 rounded-lg">' + t.status + scoreLabel + '</span>' +
      '</div>' +
      '<div class="font-black text-slate-800 mb-1">' + escapeHtml(t.title) + '</div>' +
      '<div class="text-xs text-slate-400 line-clamp-2">' + escapeHtml(t.description || meta.label) + '</div>' +
      ((t.status === '退回' || t.status === '已完成') && t.comment ? '<div class="text-xs ' + (t.status === '退回' ? 'text-red-500' : 'text-green-600') + ' font-bold mt-2">📮 老師評語：' + escapeHtml(t.comment) + '</div>' : '') +
    '</div>';
  }).join('');
}

function openTaskPlayer(taskId) {
  PREVIEW_MODE = false;
  var t = STU_DATA.tasks.find(function (x) { return x.id === taskId; });
  if (!t) return;
  if (t.type === 'LINK') openLinkTask(t);
  else if (t.type === 'PDF') openPdfTask(t);
  else if (t.type === 'FILE_SHARE') openFileShareTask(t);
  else if (t.type === 'YOUTUBE') openYoutubeTask(t);
  else if (t.type === 'PHOTO_TEXT') openPhotoTextTask(t);
  else if (t.type === 'DRAWING') openDrawingTask(t);
  else if (t.type === 'QUIZ') openQuizTask(t);
  else toast('此任務類型已不再支援，請聯絡老師處理', 'warn');

function doSubmitTask(payload) {
  if (PREVIEW_MODE) return previewSubmitTask(payload);
  payload.classId = STATE.student.classId;
  payload.studentId = STATE.student.studentId;
  payload.studentName = STATE.student.name;
  return api('submitTask', payload);
}

// 教師預覽模式下的「送出」：不呼叫真正的 submitTask、不寫入任何資料。
// 若為測驗類型（含 answers），改用含正解的題庫（教師本來就能看到）在前端直接計算成績，
// 讓教師仍可看到與學生完全相同的「送出後立即批改結果」畫面。
function previewSubmitTask(payload) {
  if (payload.answers) {
    return api('getQuizQuestions', payload.taskId).then(function (qRes) {
      var questions = qRes.data || [];
      var correct = 0;
      var details = payload.answers.map(function (a) {
        var q = questions.find(function (x) { return x.id === a.questionId; });
        var isCorrect = !!q && String(q.answer).toUpperCase() === String(a.selected).toUpperCase();
        if (isCorrect) correct++;
        return { questionId: a.questionId, text: q ? q.text : '', options: q ? q.options : [], selected: a.selected, correctAnswer: q ? q.answer : '', explanation: q ? q.explanation : '', correct: isCorrect };
      });
      var total = questions.length;
      var score = total > 0 ? Math.round((correct / total) * 100) : 0;
      return { success: true, message: '（預覽模式）已模擬批改，未實際儲存', status: '已完成', score: score, content: { answers: details, correctCount: correct, total: total } };
    });
  }
  return Promise.resolve({ success: true, message: '（預覽模式）已模擬送出，未實際儲存任何資料', status: '待批改', score: null, content: {} });
}

// 繪圖任務「插入文字」專用的輸入框：獨立於 #modal-root 之外的浮動圖層（比照作品藝廊小圖放大
// openImageLightbox 的作法），疊在繪圖任務視窗之上，輸入完成或取消都只會移除這一層，
// 不會動到底下的繪圖任務視窗與畫布內容。
function drawTextPromptOverlay() {
  return new Promise(function (resolve) {
    closeDrawTextPromptOverlay();
    var el = document.createElement('div');
    el.id = 'draw-text-prompt-root';
    el.className = 'fixed inset-0 z-[970] bg-black/40 flex items-center justify-center p-4 fade-in';
    el.innerHTML =
      '<div class="card w-full max-w-sm p-5">' +
        '<div class="text-lg font-bold mb-3">輸入文字內容</div>' +
        '<input id="draw-text-input" class="w-full border-2 border-blue-100 focus:border-blue-400 outline-none rounded-xl px-4 py-2.5 mb-4" placeholder="請輸入文字">' +
        '<div class="flex justify-end gap-3">' +
          '<button id="draw-text-cancel" class="px-5 py-2 rounded-xl bg-slate-100 font-bold hover:bg-slate-200">取消</button>' +
          '<button id="draw-text-ok" class="px-5 py-2 rounded-xl btn-primary">確定</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(el);
    var input = document.getElementById('draw-text-input');
    input.focus();
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('draw-text-ok').click(); });
    document.getElementById('draw-text-cancel').onclick = function () { closeDrawTextPromptOverlay(); resolve(null); };
    document.getElementById('draw-text-ok').onclick = function () {
      var v = input.value.trim();
      closeDrawTextPromptOverlay();
      resolve(v || null);
    };
  });
}

function closeDrawTextPromptOverlay() {
  var el = document.getElementById('draw-text-prompt-root');
  if (el) el.remove();
}

// 若任務設有背景圖，將其等比例置中繪製於畫布上（教師上傳的學習單／待標註圖片），學生在其上作畫
function drawBackgroundFill() {
  DRAW.ctx.fillStyle = '#ffffff';
  DRAW.ctx.fillRect(0, 0, DRAW.canvas.width, DRAW.canvas.height);
  if (DRAW.bgImage) {
    var scale = Math.min(DRAW.canvas.width / DRAW.bgImage.width, DRAW.canvas.height / DRAW.bgImage.height);
    var w = DRAW.bgImage.width * scale, h = DRAW.bgImage.height * scale;
    var x = (DRAW.canvas.width - w) / 2, y = (DRAW.canvas.height - h) / 2;
    DRAW.ctx.drawImage(DRAW.bgImage, x, y, w, h);
  }
}

function initDrawCanvas(bgDataUrl) {
  var canvas = document.getElementById('draw-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  DRAW = { ctx: ctx, canvas: canvas, drawing: false, tool: 'pen', color: '#1e3a8a', size: 4, undoStack: [], lastPt: null, bgImage: null };

  function finishInit() {
    drawBackgroundFill();
    saveDrawSnapshot();
    attachCanvasEvents();
  }

  function attachCanvasEvents() {
    function getPos(e) {
      var rect = canvas.getBoundingClientRect();
      var scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
      return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY, pressure: e.pressure && e.pressure > 0 ? e.pressure : 0.5 };
    }

    canvas.addEventListener('pointerdown', function (e) {
      canvas.setPointerCapture(e.pointerId);
      var p = getPos(e);
      if (DRAW.tool === 'text') {
        // 注意：這裡不能用共用的 promptDialog()，因為它是透過 openModal() 整個覆蓋 #modal-root，
        // 會把目前這個繪圖任務視窗（本身也是渲染在 #modal-root 裡）一起蓋掉，畫布跟著從畫面上消失；
        // 關閉輸入框時又會把 #modal-root 清空，整個任務圖層就跟著關閉了。改用獨立浮動圖層即可修正。
        drawTextPromptOverlay().then(function (txt) {
          if (!txt) return;
          DRAW.ctx.globalCompositeOperation = 'source-over';
          DRAW.ctx.fillStyle = DRAW.color; DRAW.ctx.font = (DRAW.size * 6) + 'px "Noto Sans TC"';
          DRAW.ctx.fillText(txt, p.x, p.y);
          saveDrawSnapshot();
        });
        return;
      }
      DRAW.drawing = true; DRAW.startPt = p; DRAW.lastPt = p;
      if (DRAW.tool === 'pen' || DRAW.tool === 'eraser') { DRAW.ctx.beginPath(); DRAW.ctx.moveTo(p.x, p.y); }
      else { DRAW.ctx.globalCompositeOperation = 'source-over'; DRAW.snapshotBeforeShape = canvas.toDataURL(); }
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!DRAW.drawing) return;
      var p = getPos(e);
      if (DRAW.tool === 'pen' || DRAW.tool === 'eraser') {
        // 橡皮擦使用 destination-out 挖除已畫內容（含背景圖），而非疊塗白色色塊
        DRAW.ctx.globalCompositeOperation = DRAW.tool === 'eraser' ? 'destination-out' : 'source-over';
        DRAW.ctx.strokeStyle = DRAW.color;
        DRAW.ctx.lineWidth = DRAW.size * (DRAW.tool === 'eraser' ? 3 : p.pressure * 1.6);
        DRAW.ctx.lineCap = 'round'; DRAW.ctx.lineJoin = 'round';
        DRAW.ctx.lineTo(p.x, p.y); DRAW.ctx.stroke();
        DRAW.lastPt = p;
      } else {
        restoreSnapshot(DRAW.snapshotBeforeShape, function () { drawShapePreview(DRAW.startPt, p); });
      }
    });
    canvas.addEventListener('pointerup', function () { if (DRAW.drawing) { DRAW.drawing = false; DRAW.ctx.globalCompositeOperation = 'source-over'; saveDrawSnapshot(); } });
    canvas.addEventListener('pointerleave', function () { if (DRAW.drawing) { DRAW.drawing = false; DRAW.ctx.globalCompositeOperation = 'source-over'; saveDrawSnapshot(); } });
  }

  if (bgDataUrl) {
    var img = new Image();
    img.onload = function () { DRAW.bgImage = img; finishInit(); };
    img.onerror = finishInit;
    img.src = bgDataUrl;
  } else {
    finishInit();
  }
}

function drawShapePreview(start, end) {
  var ctx = DRAW.ctx;
  ctx.strokeStyle = DRAW.color; ctx.lineWidth = DRAW.size; ctx.lineCap = 'round';
  ctx.beginPath();
  if (DRAW.tool === 'line') { ctx.moveTo(start.x, start.y); ctx.lineTo(end.x, end.y); }
  else if (DRAW.tool === 'rect') { ctx.rect(Math.min(start.x, end.x), Math.min(start.y, end.y), Math.abs(end.x - start.x), Math.abs(end.y - start.y)); }
  else if (DRAW.tool === 'circle') { var r = Math.hypot(end.x - start.x, end.y - start.y); ctx.arc(start.x, start.y, r, 0, Math.PI * 2); }
  ctx.stroke();
}

function restoreSnapshot(dataUrl, after) {
  var img = new Image();
  img.onload = function () { DRAW.ctx.clearRect(0, 0, DRAW.canvas.width, DRAW.canvas.height); DRAW.ctx.drawImage(img, 0, 0); if (after) after(); };
  img.src = dataUrl;
}

function saveDrawSnapshot() {
  DRAW.undoStack.push(DRAW.canvas.toDataURL());
  if (DRAW.undoStack.length > 25) DRAW.undoStack.shift();
}

function drawUndo() {
  if (DRAW.undoStack.length <= 1) return;
  DRAW.undoStack.pop();
  restoreSnapshot(DRAW.undoStack[DRAW.undoStack.length - 1]);
}

function drawClear() {
  drawBackgroundFill();
  saveDrawSnapshot();
}

function setDrawTool(tool) {
  DRAW.tool = tool;
  ['pen', 'eraser', 'line', 'rect', 'circle', 'text'].forEach(function (t) {
    var el = document.getElementById('dt-' + t);

var PDFR = { taskId: null, studentId: null, pageFileIds: [], page: 0, total: 0, tool: 'pen', color: '#f97316', strokes: {}, saveTimers: {}, drawing: false, curPath: null, annotateMode: false, fullscreen: false, locked: false, status: null, comment: '' };

  loadAnnotations.then(function (res) {

      taskId: t.id, title: t.title, studentId: STATE.student.studentId, pageFileIds: pageFileIds, page: 0, total: pageFileIds.length,

      locked: !PREVIEW_MODE && t.status === '已完成', status: t.status, comment: t.comment, score: t.score, level: t.level
    };
    var annoData = res.success ? res.data : {};

    preloadPdfPagesInBackground(t.id, pageFileIds, 1);

// 背景預載 PDF 頁面圖片：用 Image() 物件觸發瀏覽器下載並快取，不影響畫面顯示。
// 同時最多開 3 個並行下載，依序把 startIdx 之後所有頁面都預先載入；
// 若使用者已離開這個任務（開了別的 PDF 或關閉閱讀器），PDFR.taskId 會改變，預載迴圈就會自動停止。
function preloadPdfPagesInBackground(taskId, pageFileIds, startIdx) {
  var idx = startIdx;
  var concurrency = 3;
  function loadNext() {
    if (PDFR.taskId !== taskId) return; // 使用者已切換到別的任務，停止預載
    if (idx >= pageFileIds.length) return;
    var myIdx = idx++;
    var img = new Image();
    img.onload = img.onerror = loadNext;
    img.src = 'https://drive.google.com/thumbnail?id=' + pageFileIds[myIdx] + '&sz=w1600';
  }
  for (var i = 0; i < concurrency; i++) loadNext();
}

function togglePdfAnnotate() {
  PDFR.annotateMode = !PDFR.annotateMode;
  renderPdfReaderModal();
}

function togglePdfFullscreen() {
  PDFR.fullscreen = !PDFR.fullscreen;
  renderPdfReaderModal();
}

function renderPdfPage(idx) {
  flushPdfSave(PDFR.page);
  PDFR.page = idx;
  document.getElementById('pdf-page-indicator').textContent = '頁 ' + (idx + 1) + ' / ' + PDFR.total;
  var img = document.getElementById('pdf-page-img');
  img.onload = function () { syncPdfOverlaySize(); redrawPdfOverlay(); };
  img.src = 'https://drive.google.com/thumbnail?id=' + PDFR.pageFileIds[idx] + '&sz=w1600';
}

function syncPdfOverlaySize() {
  var img = document.getElementById('pdf-page-img');
  var canvas = document.getElementById('pdf-overlay');
  if (!img || !canvas) return;
  canvas.width = img.offsetWidth || img.clientWidth || 800;
  canvas.height = img.offsetHeight || img.clientHeight || 1100;
}

function redrawPdfOverlay() {
  var canvas = document.getElementById('pdf-overlay');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  var paths = PDFR.strokes[PDFR.page] || [];
  paths.forEach(function (p) { renderPdfPath(ctx, canvas.width, canvas.height, p); });
}

function renderPdfPath(ctx, width, height, path) {
  if (!path.points || path.points.length < 1) return;
  ctx.save();
  if (path.tool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = path.relWidth * width;
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = path.color;
    ctx.globalAlpha = path.tool === 'highlighter' ? 0.4 : 1;
    ctx.lineWidth = Math.max(2, path.relWidth * width);
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  path.points.forEach(function (p, i) {
    var x = p.x * width, y = p.y * height;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.restore();
}

function pdfRelWidthForTool(tool) {
  if (tool === 'highlighter') return 0.02;
  if (tool === 'eraser') return 0.035;
  return 0.006;
}

function initPdfOverlayEvents() {
  var canvas = document.getElementById('pdf-overlay');
  if (!canvas) return;
  canvas.addEventListener('pointerdown', function (e) {
    canvas.setPointerCapture(e.pointerId);
    PDFR.drawing = true;
    var rect = canvas.getBoundingClientRect();
    var relWidth = pdfRelWidthForTool(PDFR.tool);
    PDFR.curPath = { tool: PDFR.tool, color: PDFR.color, relWidth: relWidth, points: [{ x: (e.clientX - rect.left) / rect.width, y: (e.clientY - rect.top) / rect.height }] };
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!PDFR.drawing || !PDFR.curPath) return;
    var rect = canvas.getBoundingClientRect();
    var x = e.clientX - rect.left, y = e.clientY - rect.top;
    PDFR.curPath.points.push({ x: x / rect.width, y: y / rect.height });
    // 即時預覽：先重繪已存的畫記，再把「目前這一筆」以單一完整路徑整條畫上去（與
    // redrawPdfOverlay 最終呈現用的是同一個 renderPdfPath 函式），確保畫記過程中看到的
    // 透明度與畫完儲存後重新顯示的透明度完全一致，不會因逐段疊加而越畫越不透明。
    redrawPdfOverlay();
    renderPdfPath(canvas.getContext('2d'), canvas.width, canvas.height, PDFR.curPath);
  });
  function finishStroke() {
    if (!PDFR.drawing || !PDFR.curPath) return;
    PDFR.drawing = false;
    if (PDFR.curPath.points.length > 1) {
      var pageIdx = PDFR.page;
      if (!PDFR.strokes[pageIdx]) PDFR.strokes[pageIdx] = [];
      PDFR.strokes[pageIdx].push(PDFR.curPath);
      triggerPdfAutoSave(pageIdx);
    }
    PDFR.curPath = null;
    redrawPdfOverlay();
  }
  canvas.addEventListener('pointerup', finishStroke);
  canvas.addEventListener('pointerleave', finishStroke);
}

function setPdfTool(tool) {
  PDFR.tool = tool;
  ['pen', 'highlighter', 'eraser'].forEach(function (t) {
    var el = document.getElementById('pt-' + t);
    if (el) el.className = 'px-3 py-1.5 rounded-lg font-bold text-sm ' + (t === tool ? 'bg-blue-600 text-white' : 'bg-slate-100');
  });
}
function setPdfColor(c) { PDFR.color = c; }

function pdfClearPage() {
  confirmDialog('確定要清除本頁所有畫記嗎？').then(function (ok) {
    if (ok) {
      var pageIdx = PDFR.page;
      PDFR.strokes[pageIdx] = [];
      triggerPdfAutoSave(pageIdx, true);
    }
    // confirmDialog 會整個取代 modal 內容，因此無論確認或取消，都要重新畫出閱讀器
    // 才能回到原本頁面，而不是讓確認框關閉後整層直接消失
    renderPdfReaderModal();
  });
}

// 防抖自動儲存（每個頁碼各自獨立計時，避免切頁時互相覆蓋或遺失尚未儲存的畫記）
function triggerPdfAutoSave(pageIdx, immediate) {
  var status = document.getElementById('pdf-save-status');
  if (status) status.textContent = PREVIEW_MODE ? '預覽模式（不會儲存）' : '儲存中…';
  if (PREVIEW_MODE) return;
  if (PDFR.saveTimers[pageIdx]) clearTimeout(PDFR.saveTimers[pageIdx]);
  var doSave = function () {
    delete PDFR.saveTimers[pageIdx];
    var dataJson = JSON.stringify(PDFR.strokes[pageIdx] || []);
    api('saveAnnotation', { taskId: PDFR.taskId, studentId: PDFR.studentId, page: pageIdx, dataJson: dataJson }).then(function () {
      var st = document.getElementById('pdf-save-status'); if (st) st.textContent = '已同步';
    });
  };
  if (immediate) doSave(); else PDFR.saveTimers[pageIdx] = setTimeout(doSave, 1200);
}

// 離開頁面前，強制立即送出該頁尚未儲存的變更
function flushPdfSave(pageIdx) {
  if (PREVIEW_MODE) return;
  if (PDFR.saveTimers[pageIdx]) {
    clearTimeout(PDFR.saveTimers[pageIdx]);
    delete PDFR.saveTimers[pageIdx];
    var dataJson = JSON.stringify(PDFR.strokes[pageIdx] || []);
    api('saveAnnotation', { taskId: PDFR.taskId, studentId: PDFR.studentId, page: pageIdx, dataJson: dataJson });
  }
}

function pdfPrevPage() { if (PDFR.page > 0) renderPdfPage(PDFR.page - 1); }
function pdfNextPage() { if (PDFR.page < PDFR.total - 1) renderPdfPage(PDFR.page + 1); }

/* ---- 13.7 嵌入式 YouTube 影片與章節隨堂考 ---- */
var YT_STATE = null;
var YT_API_READY = null;

function loadYoutubeApi() {
  if (YT_API_READY) return YT_API_READY;
  YT_API_READY = new Promise(function (resolve) {
    if (window.YT && window.YT.Player) return resolve();
    window.onYouTubeIframeAPIReady = function () { resolve(); };
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  });
  return YT_API_READY;
}

// 舊資料沒有 hasQuiz 欄位時，視為「已勾選」以維持原本一律顯示測驗區的行為
function youtubeTaskHasQuiz(t) { return t.config.hasQuiz !== false; }

// 影片與題目完全分開：全畫面左右兩欄，左側播放 YouTube 影片、右側為題目作答表單，
// 題目不需要（也不再支援）設定影片時間點，學生可依自己步調觀看影片、隨時作答後一次送出。
// 教師若未勾選「包含隨堂考題目」，則不進這個分支，改走 openYoutubeTaskSimple 的純影片播放畫面。
function openYoutubeTask(t) {
  if (!youtubeTaskHasQuiz(t)) return openYoutubeTaskSimple(t);
  setLoading(true);
  api('getQuizQuestionsForStudent', t.id).then(function (res) {
    setLoading(false);
    if (!res.success) return toast(res.message, 'error');
    var questions = res.data;
    YT_STATE = { taskId: t.id, player: null, watchedSeconds: 0, playStartTs: null };
    openModal(
      '<div class="h-full overflow-y-auto lg:overflow-hidden grid grid-cols-1 lg:grid-cols-2 lg:h-full">' +
        '<div class="bg-black flex items-center justify-center lg:h-full">' +
          '<div class="w-full max-w-3xl aspect-video"><div id="yt-player" class="w-full h-full"></div></div>' +
        '</div>' +
        '<div class="p-5 lg:p-8 lg:h-full lg:overflow-y-auto">' +
          (PREVIEW_MODE ? previewBannerHtml() : '') +
          '<div class="text-lg font-black mb-2">▶️ ' + escapeHtml(t.title) + '</div>' +
          (t.config.prompt ? '<p class="text-slate-500 text-sm mb-4 whitespace-pre-wrap">' + escapeHtml(t.config.prompt) + '</p>' : '') +
          (questions.length === 0 ?
            '<div class="text-slate-400 text-sm mb-5">此任務尚無隨堂考題目，看完影片後可直接標記完成。</div>' :
            '<form id="yt-quiz-form" class="space-y-5 mb-5">' +
              questions.map(function (q, i) {
                return '<div class="border border-slate-100 rounded-xl p-4">' +
                  '<div class="font-bold mb-2 text-sm">' + (i + 1) + '. ' + escapeHtml(q.text) + '</div>' +
                  ['A', 'B', 'C', 'D'].map(function (letter, idx) {
                    if (!q.options[idx]) return '';
                    return '<label class="flex items-center gap-2 mb-1.5 cursor-pointer text-sm"><input type="radio" name="q_' + q.id + '" value="' + letter + '" required> ' + letter + '. ' + escapeHtml(q.options[idx]) + '</label>';
                  }).join('') +
                '</div>';
              }).join('') +
            '</form>') +
          '<button onclick="submitYoutubeQuiz(\'' + t.id + '\')" class="w-full py-3 rounded-xl btn-primary text-lg">' + (questions.length === 0 ? '✅ 標記已完成觀看' : '送出測驗，立即批改') + '</button>' +
        '</div>' +
      '</div>',
      { fullscreen: true }
    );
    loadYoutubeApi().then(function () {
      YT_STATE.player = new YT.Player('yt-player', {
        host: 'https://www.youtube-nocookie.com',
        videoId: t.config.videoId, width: '100%', height: '100%',
        playerVars: { rel: 0 },
        events: {
          onStateChange: function (e) {
            // 累計實際「播放中」的時間（暫停時不計入），做為學生觀看影片長度的依據
            if (e.data === YT.PlayerState.PLAYING) {
              if (!YT_STATE.playStartTs) YT_STATE.playStartTs = Date.now();
            } else {
              flushYtWatchTime();
            }
          }
        }
      });
    });
  });
}

// 未勾選「包含隨堂考題目」時的簡化播放畫面：不需要 YouTube IFrame API 的播放狀態事件（沒有測驗、
// 不需要精算觀看時長），直接用一般 <iframe> 嵌入影片、置中呈現，下方就是標記完成按鈕。
function openYoutubeTaskSimple(t) {
  openModal(
    '<div class="h-full flex flex-col items-center justify-center bg-black p-4 sm:p-8">' +
      (PREVIEW_MODE ? '<div class="w-full max-w-3xl mb-3">' + previewBannerHtml() + '</div>' : '') +
      '<div class="w-full max-w-3xl aspect-video flex-shrink-0">' +
        '<iframe class="w-full h-full rounded-xl" src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(t.config.videoId || '') + '?rel=0" title="' + escapeHtml(t.title) + '" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>' +
      '</div>' +
      '<button onclick="markYoutubeSimpleComplete(\'' + t.id + '\')" class="w-full max-w-3xl py-3 rounded-xl btn-accent text-lg mt-4">✅ 標記已完成觀看</button>' +
    '</div>',
    { fullscreen: true }
  );
}

function markYoutubeSimpleComplete(taskId) {
  setLoading(true);
  doSubmitTask({ taskId: taskId, answers: [], watchedSeconds: 0 }).then(function (res) {
    setLoading(false);
    if (!res.success) return toast(res.message, 'error');
    closeModal();
    toast(PREVIEW_MODE ? '（預覽模式）已示範標記完成流程，未實際儲存' : '已標記完成！', 'success');
    refreshStudentTask();
  });
}

function fmtMinSec(totalSec) { totalSec = Math.round(totalSec || 0); var m = Math.floor(totalSec / 60), s = totalSec % 60; return m + '分' + s + '秒'; }

// 將目前這一段「播放中」的時間累加進總觀看秒數，並結束計時區段
function flushYtWatchTime() {
  if (YT_STATE && YT_STATE.playStartTs) {
    YT_STATE.watchedSeconds += (Date.now() - YT_STATE.playStartTs) / 1000;
    YT_STATE.playStartTs = null;
  }
}

function submitYoutubeQuiz(taskId) {
  var form = document.getElementById('yt-quiz-form');
  var answers = [];
  if (form) {
    var data = new FormData(form);
    var names = {};
    Array.prototype.forEach.call(form.elements, function (el) { if (el.name) names[el.name] = true; });
    var missing = false;
    Object.keys(names).forEach(function (name) {
      var val = data.get(name);
      if (!val) missing = true;
      answers.push({ questionId: name.replace('q_', ''), selected: val || '' });
    });
    if (missing) return toast('請完成所有題目再送出', 'error');
  }
  flushYtWatchTime();
  setLoading(true);
  doSubmitTask({ taskId: taskId, answers: answers, watchedSeconds: Math.round(YT_STATE.watchedSeconds) }).then(function (res) {
    setLoading(false);
    if (!res.success) return toast(res.message, 'error');
    if (answers.length > 0) { renderQuizResult(res.content); }
    else { closeModal(); toast(PREVIEW_MODE ? '（預覽模式）已示範標記完成流程' : '已標記完成！', 'success'); }
    refreshStudentTask();
  });
}

/* ============================================================
 * 14. 作品藝廊／展示牆（異步發表 + 同儕鼓勵）
 * ============================================================ */
var GALLERY_CACHE = {};
var GALLERY_GROUPS = [];
var GALLERY_PEER_ON = false;

// 依任務分組：先依「教師設定的公開名稱」呈現任務卡片矩陣，點入後才看到該任務全部學生的作品
function groupGalleryItemsByTask(items) {
  var map = {}; var order = [];
  items.forEach(function (it) {
    if (!map[it.taskId]) { map[it.taskId] = { taskId: it.taskId, taskTitle: it.taskTitle, taskType: it.taskType, items: [] }; order.push(it.taskId); }
    map[it.taskId].items.push(it);
  });
  return order.map(function (id) { return map[id]; });
}

function renderGalleryTaskCardHtml(g, onclickExpr) {
  var thumb = '';
  var first = g.items[0];
  if (g.taskType === 'DRAWING' && first.content.fileId) thumb = 'https://drive.google.com/thumbnail?id=' + first.content.fileId + '&sz=w400';
  else if (g.taskType === 'PHOTO_TEXT' && first.content.photoFileIds && first.content.photoFileIds[0]) thumb = 'https://drive.google.com/thumbnail?id=' + first.content.photoFileIds[0] + '&sz=w400';
  return '<div class="cursor-pointer" onclick="' + onclickExpr + '">' +
    '<div class="relative border-2 border-orange-100 rounded-xl overflow-hidden bg-slate-50" style="aspect-ratio:1/1;">' +
      (thumb ? '<img src="' + thumb + '" class="w-full h-full object-cover">' : '<div class="w-full h-full flex items-center justify-center text-4xl">' + (g.taskType === 'DRAWING' ? '✏️' : '📷') + '</div>') +
      '<div class="absolute inset-x-0 bottom-0 bg-black/60 text-white text-xs font-bold px-2 py-1 text-center">' + g.items.length + ' 件作品</div>' +
    '</div>' +
    '<div class="text-sm font-black text-blue-800 text-center mt-1.5 truncate">' + escapeHtml(g.taskTitle) + '</div>' +
  '</div>';
}

function openGalleryView() {
  setLoading(true);
  api('getGalleryItems', STATE.student.classId).then(function (res) {
    setLoading(false);
    if (!res.success) return toast(res.message, 'error');
    if (!res.data) return;
    GALLERY_PEER_ON = res.peerInteractionEnabled;
    renderGalleryModal(res.data);
  });
}

function renderGalleryModal(items) {
  items.forEach(function (it) { GALLERY_CACHE[it.submissionId] = it; });
  GALLERY_GROUPS = groupGalleryItemsByTask(items);
  openModal(
    '<div class="text-2xl mb-1">🖼️</div>' +
    '<div class="text-lg font-black mb-4">班級作品藝廊</div>' +
    (GALLERY_GROUPS.length === 0 ? '<div class="text-slate-400 text-center py-10">目前尚無公開展示的作品，或老師尚未開啟展示牆。</div>' :
      '<div class="grid grid-cols-2 sm:grid-cols-3 gap-4">' + GALLERY_GROUPS.map(function (g, idx) { return renderGalleryTaskCardHtml(g, 'openGalleryTaskDrillDown(' + idx + ')'); }).join('') + '</div>'),
    { wide: true }
  );
}

function openGalleryTaskDrillDown(idx) {
  var g = GALLERY_GROUPS[idx];
  if (!g) return;
  openModal(
    '<div class="flex items-center gap-2 mb-4">' +
      '<button onclick="reopenGalleryTopLevel()" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 font-bold text-slate-500 shrink-0">←</button>' +
      '<div class="text-lg font-black truncate">🖼️ ' + escapeHtml(g.taskTitle) + '</div>' +
    '</div>' +
    '<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">' + g.items.map(function (it) { return renderGalleryCard(it, GALLERY_PEER_ON); }).join('') + '</div>',
    { wide: true }
  );
}

function reopenGalleryTopLevel() {
  var items = [];
  GALLERY_GROUPS.forEach(function (g) { items = items.concat(g.items); });
  renderGalleryModal(items);
}

function reopenGalleryDrillDownFor(taskId) {
  for (var i = 0; i < GALLERY_GROUPS.length; i++) {
    if (GALLERY_GROUPS[i].taskId === taskId) { openGalleryTaskDrillDown(i); return; }
  }
}

function renderGalleryCard(it, peerOn) {
  var liked = it.likedBy.indexOf(STATE.student.studentId) !== -1;
  var media = '';
  if (it.taskType === 'PHOTO_TEXT') {
    media = (it.content.text ? '<p class="text-sm mb-2 whitespace-pre-wrap">' + escapeHtml(it.content.text) + '</p>' : '') +
      '<div class="flex flex-wrap gap-1.5">' + (it.content.photoFileIds || []).map(function (id) { return '<img src="https://drive.google.com/thumbnail?id=' + id + '&sz=w400" onclick="openImageLightbox(\'' + id + '\')" class="w-20 h-20 object-cover rounded-lg border cursor-pointer">'; }).join('') + '</div>';
  } else if (it.taskType === 'DRAWING') {
    media = it.content.fileId ? '<img src="https://drive.google.com/thumbnail?id=' + it.content.fileId + '&sz=w500" onclick="openImageLightbox(\'' + it.content.fileId + '\')" class="w-full rounded-lg border cursor-pointer">' : '';
  }
  return '<div class="card p-4 border-t-4 border-orange-300">' +
    '<div class="font-black text-blue-800 text-sm mb-2">' + escapeHtml(it.studentName) + '</div>' +
    media +
    (peerOn ? (
      '<div class="flex items-center gap-3 mt-3">' +
        '<button onclick="toggleGalleryLike(\'' + it.submissionId + '\')" class="text-sm font-bold ' + (liked ? 'text-orange-500' : 'text-slate-400') + '">' + (liked ? '❤️' : '🤍') + ' ' + it.likeCount + '</button>' +
      '</div>' +
      '<div class="mt-2 space-y-1 max-h-24 overflow-y-auto" id="cm-list-' + it.submissionId + '">' +
        it.comments.map(function (c) { return '<div class="text-xs text-slate-500"><b>' + escapeHtml(c.studentName) + '：</b>' + escapeHtml(c.text) + '</div>'; }).join('') +
      '</div>' +
      '<div class="flex gap-1 mt-2">' +
        '<input id="cm-input-' + it.submissionId + '" placeholder="留言鼓勵…" class="flex-1 border-2 border-blue-100 rounded-lg px-2 py-1.5 text-xs">' +
        '<button onclick="submitGalleryComment(\'' + it.submissionId + '\')" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-bold">送出</button>' +
      '</div>'
    ) : '') +
  '</div>';
}

function toggleGalleryLike(subId) {
  api('toggleLike', { submissionId: subId, studentId: STATE.student.studentId, studentName: STATE.student.name }).then(function (res) {
    if (!res.success) return toast(res.message, 'error');
    var it = GALLERY_CACHE[subId];
    if (res.liked) { it.likeCount++; it.likedBy.push(STATE.student.studentId); }
    else { it.likeCount--; it.likedBy = it.likedBy.filter(function (id) { return id !== STATE.student.studentId; }); }
    reopenGalleryDrillDownFor(it.taskId);
  });
}

function submitGalleryComment(subId) {
  var input = document.getElementById('cm-input-' + subId);
  var text = input.value.trim();
  if (!text) return;
  api('addComment', { submissionId: subId, studentId: STATE.student.studentId, studentName: STATE.student.name, text: text }).then(function (res) {
    if (!res.success) return toast(res.message, 'error');
    var it = GALLERY_CACHE[subId];
    it.comments.push({ studentName: STATE.student.name, text: text, time: '' });
    reopenGalleryDrillDownFor(it.taskId);
  });
}

/* ============================================================
 * 15. 應用程式啟動
 * ============================================================ */
function bootstrapApp() {
  if (INIT_JOIN_CODE) STATE.view = 'studentLogin';
  render();
  if (INIT_GALLERY_TASK_ID) openSharedGalleryTask(INIT_GALLERY_TASK_ID);
  // landing 頁已透過 getLandingBundle 一併取得 webAppUrl，這裡只在非首頁進入時才需要單獨補抓
  if (STATE.view !== 'landing') {
    api('getWebAppUrl').then(function (url) { STATE.webAppUrl = url || ''; }).catch(function () {});
  }
}
bootstrapApp();
</script>
