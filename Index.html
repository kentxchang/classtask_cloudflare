/* ============================================================
 * 0. 共用工具：API 包裝 / 訊息提示 / 自訂 Modal（禁止 alert/confirm）
 * ============================================================ */
function api(fnName) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (res) { resolve(res); })
      .withFailureHandler(function (err) { reject(err); })[fnName].apply(null, args);
  });
}

function toast(msg, type) {
  type = type || 'info';
  var colors = { info: 'bg-blue-600', success: 'bg-green-600', error: 'bg-red-500', warn: 'bg-orange-500' };
  var el = document.createElement('div');
  el.className = 'fade-in text-white text-sm font-bold px-5 py-3 rounded-xl shadow-lg ' + (colors[type] || colors.info);
  el.style.maxWidth = '90vw';
  el.textContent = msg;
  document.getElementById('toast-root').appendChild(el);
  setTimeout(function () { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2200);
  setTimeout(function () { el.remove(); }, 2600);
}

function setLoading(on, text) {
  var el = document.getElementById('loading-mask');
  if (on) {
    if (!el) {
      el = document.createElement('div');
      el.id = 'loading-mask';
      el.className = 'fixed inset-0 z-[998] modal-mask flex items-center justify-center';
      el.innerHTML = '<div class="card px-8 py-6 flex flex-col items-center gap-3"><div class="w-10 h-10 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div><div class="font-bold text-blue-700">' + (text || '處理中，請稍候…') + '</div></div>';
      document.body.appendChild(el);
    }
  } else if (el) { el.remove(); }
}

function closeModal() {
  var root = document.getElementById('modal-root');

/* 作品藝廊小圖點擊放大：獨立於 modal-root 之外的圖層，疊在既有的藝廊視窗之上，
   關閉時不會連帶關掉底下的藝廊清單。 */
function openImageLightbox(fileId) {
  if (!fileId) return;
  closeImageLightbox();
  var el = document.createElement('div');
  el.id = 'lightbox-root';
  el.className = 'fixed inset-0 z-[950] bg-black/85 flex items-center justify-center p-4 fade-in';
  el.innerHTML =
    '<button onclick="closeImageLightbox()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/90 hover:bg-white font-bold text-slate-700 shadow-lg">✕</button>' +
    '<img src="https://drive.google.com/thumbnail?id=' + fileId + '&sz=w2000" class="max-w-full max-h-full rounded-xl object-contain shadow-2xl">';
  el.addEventListener('click', function (e) { if (e.target === el) closeImageLightbox(); });
  document.body.appendChild(el);
}

function closeImageLightbox() {
  var el = document.getElementById('lightbox-root');
  if (el) el.remove();
}

function openModal(innerHtml, opts) {
  opts = opts || {};
  var root = document.getElementById('modal-root');

  if (opts.fullscreen) {
    root.innerHTML =
      '<div class="fixed inset-0 z-[900] bg-white flex flex-col fade-in" id="modal-mask-el">' +
        (opts.closable === false ? '' : '<button onclick="closeModal()" class="absolute top-3 right-3 z-10 w-9 h-9 rounded-full bg-white shadow-lg font-bold text-slate-500 hover:bg-slate-100">✕</button>') +
        '<div class="flex-1 min-h-0">' + innerHtml + '</div>' +
      '</div>';
    return;
  }

  var wide = opts.wide ? 'max-w-4xl' : 'max-w-lg';
  root.innerHTML =
    '<div class="fixed inset-0 z-[900] modal-mask flex items-center justify-center p-3" id="modal-mask-el">' +
      '<div class="card fade-in w-full ' + wide + ' max-h-[92vh] overflow-y-auto p-6 relative">' +
        (opts.closable === false ? '' : '<button onclick="closeModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 font-bold text-slate-500">✕</button>') +
        innerHtml +
      '</div>' +
    '</div>';
  if (opts.closable !== false) {
    document.getElementById('modal-mask-el').addEventListener('click', function (e) {
      if (e.target.id === 'modal-mask-el') closeModal();
    });
  }
}

function confirmDialog(msg, okText) {
  return new Promise(function (resolve) {
    openModal(
      '<div class="text-lg font-bold mb-4 pr-8">' + msg + '</div>' +
      '<div class="flex justify-end gap-3">' +
        '<button id="cf-no" class="px-5 py-2 rounded-xl bg-slate-100 font-bold hover:bg-slate-200">取消</button>' +
        '<button id="cf-yes" class="px-5 py-2 rounded-xl btn-accent">' + (okText || '確定') + '</button>' +
      '</div>', { closable: false });
    document.getElementById('cf-no').onclick = function () { closeModal(); resolve(false); };
    document.getElementById('cf-yes').onclick = function () { closeModal(); resolve(true); };
  });
}

function promptDialog(title, placeholder, defVal) {
  return new Promise(function (resolve) {
    openModal(
      '<div class="text-lg font-bold mb-3 pr-8">' + title + '</div>' +
      '<input id="pd-input" class="w-full border-2 border-blue-100 focus:border-blue-400 outline-none rounded-xl px-4 py-2.5 mb-4" placeholder="' + (placeholder || '') + '" value="' + (defVal || '') + '">' +
      '<div class="flex justify-end gap-3">' +
        '<button id="pd-no" class="px-5 py-2 rounded-xl bg-slate-100 font-bold hover:bg-slate-200">取消</button>' +
        '<button id="pd-yes" class="px-5 py-2 rounded-xl btn-primary">確定</button>' +
      '</div>', { closable: false });
    var input = document.getElementById('pd-input');
    input.focus();
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('pd-yes').click(); });
    document.getElementById('pd-no').onclick = function () { closeModal(); resolve(null); };
    document.getElementById('pd-yes').onclick = function () { closeModal(); resolve(input.value.trim()); };
  });
}

/* ============================================================
 * 1. 影像壓縮 / 檔案轉 Base64
 * ============================================================ */
function compressImageFile(file, maxWidth) {
  maxWidth = maxWidth || 800;
  return new Promise(function (resolve, reject) {
    var img = new Image();
    var reader = new FileReader();
    reader.onload = function (e) {
      img.onload = function () {
        var scale = Math.min(1, maxWidth / img.width);
        var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve({ base64: canvas.toDataURL('image/jpeg', 0.82), mimeType: 'image/jpeg' });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// 「分享檔案」任務用：不壓縮、不限檔案類型，單純讀成 Base64 供 uploadFile 上傳
function readFileAsBase64(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function (e) { resolve(e.target.result); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================================================
 * 2.5 前端載入加速：預先快取（點入課堂／切換分頁時優先秒開，背景仍會靜默更新最新資料）
 * ============================================================ */
var CLASS_CACHE = {};        // 教師端：課堂ID -> { classInfo, categories, tasks, activeCategoryId }
var STU_DATA_CACHE = {};     // 學生端：課堂ID -> getTasksForStudent() 回傳結果

var GALLERY_MGMT_CACHE = {}; // 教師端「作品藝廊」管理分頁：課堂ID -> getGalleryManagementData() 回傳結果
var TEACHER_PWD_SET_CACHE = null; // 首頁預先得知是否已設定教師密碼，讓「教師入口」點下去不必再等一次來回

// 通用「先顯示快取、背景仍取得最新資料」工具：cache 命中時立即以舊資料回呼一次（fromCache=true），
// 稍後拿到最新資料後再回呼一次（fromCache=false）並更新快取；沒有快取時只會在資料到達後回呼一次。
function loadWithCache(cache, key, fetchFn, onData, onError) {
  var cached = cache[key];
  if (cached) onData(cached, true);
  fetchFn().then(function (res) {
    if (!res || !res.success) { if (!cached && onError) onError(res ? res.message : '載入失敗'); return; }
    cache[key] = res;
    onData(res, false);
  }).catch(function (e) { if (!cached && onError) onError('' + e); });
}

// 課堂內容（分類＋任務）目前存放在 STATE.categories / STATE.tasks 並會被許多操作直接就地修改，
// 每次重新渲染課堂詳細頁時同步寫回 CLASS_CACHE，確保快取內容與畫面上看到的資料一致。
function syncClassCache() {
  if (!STATE.currentClass) return;
  CLASS_CACHE[STATE.currentClass.id] = {
    classInfo: STATE.currentClass,
    categories: STATE.categories,
    tasks: STATE.tasks,
    activeCategoryId: STATE.activeCategoryId
  };
}

    case 'studentLogin': app.innerHTML = viewStudentLogin(); wireStudentLoginRoster(); break;
    case 'studentClassPicker': app.innerHTML = viewStudentClassPicker(); wireStudentClassPicker(); break;
    case 'studentDashboard': app.innerHTML = viewStudentDashboard(); wireStudentDashboard(); break;
  }
}

var PUBLIC_GALLERY_GROUPS = [];

function wireLanding() {
  api('getLandingBundle').then(function (res) {
    var area = document.getElementById('public-gallery-area');
    if (!res.success) { if (area) area.innerHTML = '<div class="text-red-500 text-center py-10">' + res.message + '</div>'; return; }
    STATE.webAppUrl = res.webAppUrl || STATE.webAppUrl;
    TEACHER_PWD_SET_CACHE = !!res.teacherPasswordSet;
    var galleryRes = res.gallery;
    if (!area) return;
    if (!galleryRes.success) { area.innerHTML = '<div class="text-red-500 text-center py-10">' + galleryRes.message + '</div>'; return; }
    PUBLIC_GALLERY_GROUPS = groupGalleryItemsByTask(galleryRes.data);
    area.innerHTML = PUBLIC_GALLERY_GROUPS.length === 0 ?
      '<div class="card p-8 text-center text-slate-400">目前尚無老師設定為完全公開的作品。</div>' :
      '<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">' + PUBLIC_GALLERY_GROUPS.map(function (g, idx) { return renderGalleryTaskCardHtml(g, 'openPublicGalleryDrillDown(' + idx + ')'); }).join('') + '</div>';
  }).catch(function () {
    var area = document.getElementById('public-gallery-area');
    if (area) area.innerHTML = '<div class="text-red-500 text-center py-10">載入失敗，請重新整理頁面</div>';
  });
}

function openPublicGalleryDrillDown(idx) {
  var g = PUBLIC_GALLERY_GROUPS[idx];
  if (!g) return;
  openModal(
    '<div class="text-lg font-black mb-4">🖼️ ' + escapeHtml(g.taskTitle) + '（' + g.items.length + ' 件作品）</div>' +
    '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">' + g.items.map(renderPublicGalleryCard).join('') + '</div>',
    { wide: true }
  );
}

function renderPublicGalleryCard(it) {

  if (it.taskType === 'PHOTO_TEXT') {
    media = (it.content.text ? '<p class="text-sm mb-2 whitespace-pre-wrap">' + escapeHtml(it.content.text) + '</p>' : '') +
      '<div class="flex flex-wrap gap-1.5">' + (it.content.photoFileIds || []).map(function (id) { return '<img src="https://drive.google.com/thumbnail?id=' + id + '&sz=w400" onclick="openImageLightbox(\'' + id + '\')" class="w-20 h-20 object-cover rounded-lg border cursor-pointer">'; }).join('') + '</div>';
  } else if (it.taskType === 'DRAWING') {
    media = it.content.fileId ? '<img src="https://drive.google.com/thumbnail?id=' + it.content.fileId + '&sz=w500" onclick="openImageLightbox(\'' + it.content.fileId + '\')" class="w-full rounded-lg border cursor-pointer">' : '';
  }
  return '<div class="card p-4 border-t-4 border-orange-300">' +
    '<div class="font-black text-blue-800 text-sm mb-2">' + escapeHtml(it.studentName) + '</div>' +
    media +
  '</div>';
}

function openSharedGalleryTask(taskId) {
  setLoading(true);
  api('getPublicGalleryItemsForTask', taskId).then(function (res) {
    setLoading(false);
    if (!res.success) return toast(res.message, 'error');

        '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">' + res.data.items.map(renderPublicGalleryCard).join('') + '</div>'),

    );
  }).catch(function (e) { setLoading(false); toast('連線失敗：' + e, 'error'); });
}

function enterTeacherPortal() {
  if (TEACHER_PWD_SET_CACHE !== null) { goto(TEACHER_PWD_SET_CACHE ? 'teacherLogin' : 'teacherSetup'); return; }
  setLoading(true);
  api('isTeacherPasswordSet').then(function (res) {

  }).catch(function (e) { setLoading(false); toast('連線失敗：' + e, 'error'); });

function viewTeacherSetup() {

  '<div class="max-w-md mx-auto px-4 py-8">' +

function viewTeacherLogin() {

    '<div class="card p-8">' +

      '<input id="login-pwd" type="password" placeholder="請輸入教師密碼" class="w-full border-2 border-blue-100 focus:border-blue-400 outline-none rounded-xl px-4 py-3 mb-5">' +
      '<button onclick="submitTeacherLogin()" class="w-full py-3 rounded-xl btn-primary text-lg">登入</button>' +
    '</div>' +
  '</div>';
}

function submitTeacherLogin() {
  var pwd = document.getElementById('login-pwd').value.trim();
  setLoading(true);
  api('loginTeacher', pwd).then(function (res) {

/* ============================================================
 * 5. 教師儀表板：課堂列表
 * ============================================================ */
function loadTeacherDashboard() {
  STATE.currentClass = null;
  goto('teacherDashboard');
}

function teacherLogout() {
  STATE.teacher = { loggedIn: false };
  STATE.currentClass = null;
  STATE.categories = []; STATE.tasks = []; STATE.activeCategoryId = null;
  TEACHER_CLASSES_CACHE = [];
  CLASS_CACHE = {}; STUDENTS_TAB_CACHE = {}; GRADING_CACHE = {}; GALLERY_MGMT_CACHE = {};
  goto('landing');
}

var TEACHER_CLASSES_CACHE = [];

function viewTeacherDashboard() {
  if (STATE.currentClass) return viewClassDetail();
  return headerBar('教師儀表板・課堂管理', null) +
  '<div class="max-w-6xl mx-auto px-4 pb-16">' +
    '<div class="flex justify-end gap-2 mb-4 flex-wrap">' +
      '<button onclick="openStudentLoginSettingsModal()" class="px-5 py-2.5 rounded-xl font-bold bg-white shadow text-indigo-600 hover:bg-indigo-50">⚙️ 學生免密碼登入設定</button>' +
      '<button onclick="openGlobalRosterModal()" class="px-5 py-2.5 rounded-xl font-bold bg-white shadow text-blue-600">👥 學生總名單</button>' +
      '<button onclick="openCreateClassModal()" class="px-5 py-2.5 rounded-xl btn-accent">＋ 建立新課堂</button>' +
      '<button onclick="teacherLogout()" class="px-5 py-2.5 rounded-xl font-bold bg-white shadow text-slate-500">🚪 登出</button>' +
    '</div>' +
    '<div id="class-list-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">' +
      '<div class="text-slate-400 col-span-full text-center py-10">載入中…</div>' +
    '</div>' +
  '</div>';
}

function wireTeacherDashboard() {
  if (STATE.currentClass) { wireClassDetail(); return; }
  // 一次回傳課堂列表＋每堂課的分類與任務，並全數預先寫入 CLASS_CACHE，
  // 之後點入任何一堂課都能直接從快取秒開，不必再等伺服器來回。
  api('getAllClassesWithDetails').then(function (res) {
    if (!res.success) return toast(res.message, 'error');
    TEACHER_CLASSES_CACHE = res.classes;
    Object.keys(res.details).forEach(function (cid) {
      var d = res.details[cid];
      var existing = CLASS_CACHE[cid];
      CLASS_CACHE[cid] = {
        classInfo: d.classInfo,
        categories: d.categories || [],
        tasks: d.tasks || [],
        activeCategoryId: (existing && (d.categories || []).some(function (c) { return c.id === existing.activeCategoryId; })) ? existing.activeCategoryId : ((d.categories && d.categories[0]) ? d.categories[0].id : null)
      };
    });
    var grid = document.getElementById('class-list-grid');
    if (!grid) return;
    if (res.classes.length === 0) {
      grid.innerHTML = '<div class="text-slate-400 col-span-full text-center py-10">尚未建立任何課堂，點選右上角「＋ 建立新課堂」開始使用。</div>';
      return;
    }
    grid.innerHTML = res.classes.map(function (c, idx) {
      return '<div class="card card-hover anim-pop p-6 border-b-8 border-blue-500 cursor-pointer" style="animation-delay:' + (idx * 0.06) + 's" onclick="openClass(\'' + c.id + '\')">' +
        '<div class="flex justify-between items-start">' +
          '<div>' +
            '<div class="text-lg font-black text-blue-800">' + escapeHtml(c.name) + '</div>' +
            '<div class="text-sm text-slate-500 font-medium">' + escapeHtml(c.subject || '未設定科目') + '</div>' +
          '</div>' +
          '<div class="text-xs font-black bg-orange-100 text-orange-600 px-2.5 py-1 rounded-lg">代碼 ' + c.joinCode + '</div>' +
        '</div>' +
        '<div class="text-xs text-slate-400 mt-4">建立於 ' + fmtDate(c.createdAt) + '</div>' +
      '</div>';
    }).join('');
  });
}

function repairFileSharing() {
  confirmDialog('此操作會將「上傳的資料」資料夾內所有已上傳的檔案（PDF頁面、照片、手繪作品等）權限修正為「知道連結的使用者皆可檢視」，讓學生在任何裝置都能正常看到圖片。檔案較多時可能需要一些時間，確定要執行嗎？', '開始修復').then(function (ok) {
    if (!ok) return;
    setLoading(true, '正在修復檔案權限，請稍候…');
    api('repairAllFileSharing').then(function (res) {
      setLoading(false);
      if (res.success) toast(res.message, 'success'); else toast(res.message, 'error');
    }).catch(function (err) { setLoading(false); toast('' + err, 'error'); });
  });
}

function openCreateClassModal() {
  setLoading(true);
  api('getStudentRoster').then(function (res) {
    setLoading(false);
    var students = res.success ? res.data : [];
    openModal(
      '<div class="text-lg font-bold mb-4">建立新課堂</div>' +
      '<label class="text-sm font-bold text-slate-500">課堂名稱</label>' +
      '<input id="nc-name" placeholder="例如：5年2班 自然科" class="w-full border-2 border-blue-100 focus:border-blue-400 outline-none rounded-xl px-4 py-2.5 mt-1 mb-3">' +
      '<label class="text-sm font-bold text-slate-500">科目 / 說明（選填）</label>' +
      '<input id="nc-subject" placeholder="例如：自然科" class="w-full border-2 border-blue-100 focus:border-blue-400 outline-none rounded-xl px-4 py-2.5 mt-1 mb-3">' +
      '<div class="flex items-center justify-between mb-1">' +
        '<label class="text-sm font-bold text-slate-500">選擇加入此課堂的學生（可不選，之後再到「學生名單」分頁指派）</label>' +
        '<button type="button" onclick="toggleAllEnrollChecks(\'nc-student-list\')" class="text-xs font-bold text-blue-600 hover:underline whitespace-nowrap ml-2">全選／全不選</button>' +
      '</div>' +
      '<div id="nc-student-list" class="max-h-48 overflow-y-auto border-2 border-blue-100 rounded-xl p-2 mb-5 grid grid-cols-2 gap-1">' +
        (students.length === 0 ? '<div class="text-slate-400 text-sm col-span-2 py-4 text-center">尚無學生，請先於「👥 學生總名單」新增</div>' : renderStudentCheckboxList(students, [])) +
      '</div>' +
      '<button onclick="submitCreateClass()" class="w-full py-3 rounded-xl btn-primary text-lg">建立課堂</button>',
      { wide: true }
    );
  });
}

function renderStudentCheckboxList(students, checkedIds) {
  return students.map(function (s) {
    var checked = checkedIds.indexOf(s.id) !== -1;
    return '<label class="flex items-center gap-2 py-1.5 px-2 rounded-lg hover:bg-blue-50 cursor-pointer text-sm">' +
      '<input type="checkbox" class="enroll-chk" value="' + s.id + '" ' + (checked ? 'checked' : '') + '> ' + escapeHtml(s.name) +
    '</label>';
  }).join('');
}

function toggleAllEnrollChecks(containerId) {
  var boxes = document.querySelectorAll('#' + containerId + ' .enroll-chk');
  var allChecked = true;
  Array.prototype.forEach.call(boxes, function (b) { if (!b.checked) allChecked = false; });
  Array.prototype.forEach.call(boxes, function (b) { b.checked = !allChecked; });
}

function getCheckedEnrollIds(containerId) {
  var boxes = document.querySelectorAll('#' + containerId + ' .enroll-chk:checked');
  return Array.prototype.map.call(boxes, function (b) { return b.value; });
}

function submitCreateClass() {
  var name = document.getElementById('nc-name').value.trim();
  var subject = document.getElementById('nc-subject').value.trim();
  if (!name) return toast('請輸入課堂名稱', 'error');
  var studentIds = getCheckedEnrollIds('nc-student-list');
  setLoading(true);
  api('createClass', { name: name, subject: subject }).then(function (res) {
    if (!res.success) { setLoading(false); toast(res.message, 'error'); return null; }
    if (studentIds.length === 0) return res;
    return api('setClassEnrollment', res.classId, studentIds).then(function () { return res; });
  }).then(function (res) {
    setLoading(false);
    if (res && res.success) { closeModal(); toast('課堂建立成功！', 'success'); wireTeacherDashboard(); }
  }).catch(function (e) { setLoading(false); toast('' + e, 'error'); });
}

function openClass(classId) {
  var cached = CLASS_CACHE[classId];
  if (cached) {
    STATE.currentClass = cached.classInfo;
    STATE.categories = cached.categories;
    STATE.tasks = cached.tasks;
    STATE.activeCategoryId = cached.activeCategoryId && cached.categories.some(function (c) { return c.id === cached.activeCategoryId; }) ? cached.activeCategoryId : (cached.categories[0] ? cached.categories[0].id : null);
    STATE.teacherClassTab = 'content';
    goto('teacherDashboard');
    return;
  }
  // 快取還沒準備好時（例如課堂列表尚未載入完成就被點擊）才 fallback 呼叫伺服器
  setLoading(true);
  api('getClassDetailBundle', classId).then(function (res) {
    setLoading(false);
    if (!res.success) return toast(res.message, 'error');
    STATE.currentClass = res.data.classInfo;
    STATE.categories = res.data.categories || [];
    STATE.tasks = res.data.tasks || [];
    STATE.activeCategoryId = STATE.categories[0] ? STATE.categories[0].id : null;
    STATE.teacherClassTab = 'content';
    syncClassCache();
    goto('teacherDashboard');
  }).catch(function (e) { setLoading(false); toast('' + e, 'error'); });
}

function backToClassList() { STATE.currentClass = null; goto('teacherDashboard'); }

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function isSafeHttpUrl(url) {
  return /^https?:\/\//i.test(String(url || '').trim());
}

/* ============================================================
 * 6. 課堂詳細頁：分頁切換（內容 / 學生 / 批改總覽 / 設定與QR）
 * ============================================================ */
function viewClassDetail() {
  var c = STATE.currentClass;
  // 每個功能各自搭配專屬圖示與配色，做成小圖磚樣式，跟下方分類頁籤的長條藥丸樣式明顯區隔開來
  var tabs = [
    ['content', '📚', '單元內容', 'from-blue-500 to-indigo-600', 'text-blue-600 bg-blue-50'],
    ['students', '🎒', '學生名單', 'from-teal-400 to-cyan-600', 'text-teal-600 bg-teal-50'],
    ['grading', '📝', '批改與總覽', 'from-purple-400 to-violet-600', 'text-purple-600 bg-purple-50'],
    ['gallery', '🖼️', '作品藝廊', 'from-pink-400 to-rose-500', 'text-pink-600 bg-pink-50'],
    ['settings', '⚙️', '課堂設定', 'from-slate-400 to-slate-600', 'text-slate-600 bg-slate-100']
  ];
  return (
  '<div class="max-w-6xl mx-auto px-4 pt-6 pb-2 flex items-start justify-between gap-4 flex-wrap">' +
    '<div class="flex items-center gap-3">' +
      '<button onclick="backToClassList()" class="w-10 h-10 rounded-full bg-white shadow font-bold text-blue-600 hover:bg-blue-50">←</button>' +
      '<div>' +
        '<h1 class="text-xl md:text-2xl font-black text-blue-800">' + escapeHtml(c.name) + '</h1>' +
        '<div class="text-xs text-slate-400 font-bold">加入代碼：' + c.joinCode + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="flex gap-2 overflow-x-auto pb-1 max-w-full">' +
      tabs.map(function (t) {
        var active = STATE.teacherClassTab === t[0];
        return '<button onclick="switchClassTab(\'' + t[0] + '\')" class="flex-shrink-0 flex flex-col items-center justify-center gap-0.5 rounded-2xl px-3.5 py-2 min-w-[72px] font-bold transition-all duration-200 ' +
          (active ? 'text-white shadow-lg -translate-y-1 bg-gradient-to-br ' + t[3] : 'hover:-translate-y-0.5 hover:shadow-md ' + t[4]) + '">' +
          '<span class="text-xl">' + t[1] + '</span>' +
          '<span class="text-[10px] whitespace-nowrap">' + t[2] + '</span>' +
        '</button>';
      }).join('') +
    '</div>' +
  '</div>' +
  '<div class="max-w-6xl mx-auto px-4">' +
    '<div class="h-px w-full mt-3 mb-6" style="background:linear-gradient(90deg,rgba(129,140,248,0),rgba(129,140,248,.5) 20%,rgba(251,146,60,.5) 80%,rgba(251,146,60,0));"></div>' +
  '</div>' +
  '<div class="max-w-6xl mx-auto px-4 pb-16" id="class-tab-body"></div>'
  );
}

function switchClassTab(tab) { STATE.teacherClassTab = tab; goto('teacherDashboard'); }

function wireClassDetail() {
  syncClassCache();
  var body = document.getElementById('class-tab-body');
  if (!body) return;
  if (STATE.teacherClassTab === 'content') renderContentTab(body);
  else if (STATE.teacherClassTab === 'students') renderStudentsTab(body);
  else if (STATE.teacherClassTab === 'grading') renderGradingTab(body);
  else if (STATE.teacherClassTab === 'gallery') renderTeacherGalleryTab(body);
  else if (STATE.teacherClassTab === 'settings') renderSettingsTab(body);
}

// 教師端「作品藝廊」：唯讀檢視目前會顯示在學生藝廊中的所有作品（不提供按讚／留言互動）
// 教師端「作品藝廊」管理：列出課堂內所有圖文回應／手繪任務，可逐一或一鍵切換公開程度，
// 「完全公開」的任務另可產生免登入的分享連結與 QR Code。
var TEACHER_GALLERY_TASKS = [];

function renderTeacherGalleryTab(body) {
  var classId = STATE.currentClass.id;
  if (!GALLERY_MGMT_CACHE[classId]) body.innerHTML = '<div class="text-slate-400 text-center py-8">載入中…</div>';
  loadWithCache(GALLERY_MGMT_CACHE, classId, function () { return api('getGalleryManagementData', classId); }, function (res) {
    if (!STATE.currentClass || STATE.currentClass.id !== classId || STATE.teacherClassTab !== 'gallery') return;
    var body = document.getElementById('class-tab-body');
    if (!body) return;
    TEACHER_GALLERY_TASKS = res.data;
    if (TEACHER_GALLERY_TASKS.length === 0) {
      body.innerHTML = '<div class="card p-8 text-center text-slate-400">此課堂目前沒有圖文回應或手繪任務，作品藝廊僅適用於這兩種任務類型。</div>';
      return;
    }
    body.innerHTML =
      '<div class="text-xs text-slate-400 mb-4">設定每個任務在作品藝廊的公開程度：「公開」僅本班已登入學生看得到；「完全公開」則任何人不需登入即可在首頁查看，並可產生專屬分享連結與 QR Code。只要學生已繳交即會顯示，不需要等教師完成批改。</div>' +
      '<div class="flex flex-wrap gap-2 mb-4">' +
        '<button onclick="bulkSetGalleryMode(\'off\')" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm hover:bg-slate-200">🚫 一鍵全關（全部不公開）</button>' +
        '<button onclick="bulkSetGalleryMode(\'class\')" class="px-4 py-2 rounded-xl bg-blue-50 text-blue-600 font-bold text-sm hover:bg-blue-100">👥 一鍵全開（全部公開）</button>' +
      '</div>' +
      '<div class="space-y-3">' + TEACHER_GALLERY_TASKS.map(renderGalleryManagementRow).join('') + '</div>';
  }, function (msg) {
    var body = document.getElementById('class-tab-body');
    if (body) body.innerHTML = '<div class="text-red-500">' + msg + '</div>';
  });
}

function renderGalleryManagementRow(t) {
  var mode = t.galleryFullyPublic ? 'public' : (t.galleryPublished ? 'class' : 'off');
  return '<div class="card p-4 flex flex-wrap items-center justify-between gap-3">' +
    '<div>' +
      '<div class="font-bold text-slate-700">' + escapeHtml(t.galleryLabel) + '</div>' +
      '<div class="text-xs text-slate-400">' + (t.type === 'DRAWING' ? '✏️ 手繪' : '📷 圖文回應') + '　已繳交 ' + t.completedCount + ' 件</div>' +
    '</div>' +
    '<div class="flex items-center gap-2 flex-wrap">' +
      (t.completedCount > 0 ? '<button onclick="previewGalleryTask(\'' + t.taskId + '\')" class="px-3 py-2 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm hover:bg-slate-200">👁 預覽</button>' : '') +
      '<select onchange="setTaskGalleryModeAndRefresh(\'' + t.taskId + '\', this.value)" class="border-2 border-blue-100 rounded-xl px-3 py-2 text-sm">' +
        '<option value="off"' + (mode === 'off' ? ' selected' : '') + '>不公開</option>' +
        '<option value="class"' + (mode === 'class' ? ' selected' : '') + '>公開（本班）</option>' +
        '<option value="public"' + (mode === 'public' ? ' selected' : '') + '>完全公開（免登入）</option>' +
      '</select>' +
      (mode === 'public' ? '<button onclick="openGalleryShareModal(\'' + t.taskId + '\')" class="px-3 py-2 rounded-xl bg-orange-50 text-orange-600 font-bold text-sm hover:bg-orange-100">🔗 分享連結</button>' : '') +
    '</div>' +
  '</div>';
}

function setTaskGalleryModeAndRefresh(taskId, mode) {
  setLoading(true);

/* ============================================================
 * 6.5 通用拖曳排序（Pointer Events，滑鼠／觸控／Apple Pencil 皆適用）
 * ============================================================ */
function initSortableList(container, itemSelector, handleSelector, onReorder) {
  if (!container || container.getAttribute('data-sortable-bound') === '1') return;
  container.setAttribute('data-sortable-bound', '1');
  var draggingEl = null;
  var moveHandler = null, upHandler = null;

  container.addEventListener('pointerdown', function (e) {
    var handle = e.target.closest(handleSelector);
    if (!handle || !container.contains(handle)) return;
    var item = handle.closest(itemSelector);
    if (!item) return;
    e.preventDefault();
    draggingEl = item;
    item.classList.add('dragging-item');

    moveHandler = function (ev) {
      if (!draggingEl) return;
      var elAtPoint = document.elementFromPoint(ev.clientX, ev.clientY);
      if (!elAtPoint) return;
      var target = elAtPoint.closest(itemSelector);
      if (!target || target === draggingEl || target.parentElement !== container) return;
      var items = Array.prototype.slice.call(container.querySelectorAll(itemSelector));
      var dragIdx = items.indexOf(draggingEl);
      var targetIdx = items.indexOf(target);
      if (dragIdx === -1 || targetIdx === -1) return;
      if (dragIdx < targetIdx) container.insertBefore(draggingEl, target.nextSibling);
      else container.insertBefore(draggingEl, target);
      updateOrderBadges(container, itemSelector);
    };
    upHandler = function () {
      if (!draggingEl) return;
      draggingEl.classList.remove('dragging-item');
      document.removeEventListener('pointermove', moveHandler);
      document.removeEventListener('pointerup', upHandler);
      var items = Array.prototype.slice.call(container.querySelectorAll(itemSelector));
      var orderedIds = items.map(function (el) { return el.getAttribute('data-sort-id'); });
      draggingEl = null;
      onReorder(orderedIds);
    };
    document.addEventListener('pointermove', moveHandler);
    document.addEventListener('pointerup', upHandler);
  });
}

function updateOrderBadges(container, itemSelector) {
  var items = container.querySelectorAll(itemSelector);
  Array.prototype.forEach.call(items, function (el, idx) {
    var badge = el.querySelector('.order-badge');
    if (badge) badge.textContent = idx + 1;
  });
}

/**
 * 將 PDF 逐頁轉為 JPEG 圖片並依序上傳（比照參考書櫃程式的作法）：
 * 先建立一次性資料夾，再逐頁呼叫 uploadPdfPage，並回報進度。
 */
function convertAndUploadPdf(file, title, onProgress, classId, categoryId) {
  return file.arrayBuffer().then(function (buf) {
    if (onProgress) onProgress(3, '正在解析 PDF 檔案…');
    return pdfjsLib.getDocument({ data: buf }).promise;
  }).then(function (pdfDoc) {
    var totalPages = pdfDoc.numPages;
    if (onProgress) onProgress(6, '正在初始化雲端資料夾…');
    return api('initPdfPageFolder', title, classId, categoryId).then(function (initRes) {
      if (!initRes.success) throw new Error(initRes.message);
      var folderId = initRes.folderId;
      var pageFileIds = [];

      function uploadNext(i) {
        if (i >= totalPages) return Promise.resolve();
        return pdfDoc.getPage(i + 1).then(function (page) {
          var unscaled = page.getViewport({ scale: 1 });
          var maxWidth = 1024;
          var scale = Math.min(1, maxWidth / unscaled.width);
          var viewport = page.getViewport({ scale: scale });
          var canvas = document.createElement('canvas');
          canvas.width = viewport.width; canvas.height = viewport.height;
          return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise.then(function () {
            var base64Img = canvas.toDataURL('image/jpeg', 0.85);
            var percent = Math.floor(6 + ((i + 1) / totalPages) * 90);
            if (onProgress) onProgress(percent, '正在上傳第 ' + (i + 1) + ' / ' + totalPages + ' 頁…');
            return api('uploadPdfPage', folderId, i, base64Img);
          });
        }).then(function (pageRes) {
          if (!pageRes.success) throw new Error(pageRes.message);
          pageFileIds.push(pageRes.fileId);
          return uploadNext(i + 1);
        });
      }

      return uploadNext(0).then(function () {
        if (onProgress) onProgress(100, '上傳完成！');
        return { pageFileIds: pageFileIds, totalPages: totalPages };
      });
    });
  });
}

function submitCreateTask(type) {
  var title = document.getElementById('cfg-title').value.trim();
  var desc = document.getElementById('cfg-desc').value.trim();
  if (!title) return toast('請輸入任務標題', 'error');
  var config = {};

  function doCreate() {
    setLoading(true);
    api('createTask', { classId: STATE.currentClass.id, categoryId: STATE.activeCategoryId, type: type, title: title, description: desc, config: config }).then(function (res) {
      setLoading(false);
      if (!res.success) return toast(res.message, 'error');
      closeModal(); toast('任務建立成功！', 'success');
      api('getTasks', STATE.currentClass.id).then(function (r2) {
        STATE.tasks = r2.data || [];
        goto('teacherDashboard');
        if (type === 'QUIZ' || type === 'YOUTUBE') openQuestionManager(res.taskId, type);
      });
    });
  }

  if (type === 'LINK') {
    var url = document.getElementById('cfg-url').value.trim();
    if (!url) return toast('請輸入連結網址', 'error');
    if (!isSafeHttpUrl(url)) return toast('連結網址必須以 http:// 或 https:// 開頭', 'error');
    config = { url: url }; doCreate();
  } else if (type === 'PDF') {
    var fileInput = document.getElementById('cfg-pdf');
    if (!fileInput.files[0]) return toast('請選擇 PDF 檔案', 'error');
    var submitBtn = document.getElementById('submit-task-btn');
    var wrap = document.getElementById('pdf-progress-wrap');
    var bar = document.getElementById('pdf-progress-bar');
    var text = document.getElementById('pdf-progress-text');
    if (submitBtn) submitBtn.disabled = true;
    if (wrap) wrap.classList.remove('hidden');
    convertAndUploadPdf(fileInput.files[0], title, function (percent, statusText) {
      if (bar) bar.style.width = percent + '%';
      if (text) text.textContent = statusText;
    }, STATE.currentClass.id, STATE.activeCategoryId).then(function (result) {
      config = { pageFileIds: result.pageFileIds, totalPages: result.totalPages };
      doCreate();
    }).catch(function (err) {
      if (submitBtn) submitBtn.disabled = false;
      toast('PDF 轉換上傳失敗：' + err, 'error');
    });
  } else if (type === 'FILE_SHARE') {
    var shareFileInput = document.getElementById('cfg-file');
    if (!shareFileInput.files[0]) return toast('請選擇要分享的檔案', 'error');
    var shareFile = shareFileInput.files[0];
    if (shareFile.size > FILE_SHARE_MAX_BYTES) return toast('檔案過大（上限 20MB），請改用較小的檔案', 'error');
    setLoading(true, '上傳檔案中…');
    readFileAsBase64(shareFile).then(function (base64) {
      return api('uploadFile', { base64Data: base64, mimeType: shareFile.type || 'application/octet-stream', fileName: shareFile.name, folderName: '分享檔案_' + title, classId: STATE.currentClass.id, categoryId: STATE.activeCategoryId });
    }).then(function (r) {
      setLoading(false);
      if (!r.success) return toast(r.message, 'error');
      config = { fileId: r.fileId, fileName: r.fileName, mimeType: shareFile.type || '' };
      doCreate();
    }).catch(function (err) {
      setLoading(false);
      toast('檔案上傳失敗：' + err, 'error');
    });
  } else if (type === 'YOUTUBE') {
    var yturl = document.getElementById('cfg-yturl').value.trim();
    if (!yturl) return toast('請輸入 YouTube 網址', 'error');
    var hasQuizChk = document.getElementById('cfg-yt-hasquiz');
    config = { videoUrl: yturl, videoId: extractYoutubeId(yturl), hasQuiz: !!(hasQuizChk && hasQuizChk.checked) }; doCreate();
  } else if (type === 'PHOTO_TEXT') {
    config = Object.assign({ prompt: document.getElementById('cfg-prompt').value.trim() }, readGalleryConfigFields(false)); doCreate();
  } else if (type === 'DRAWING') {
    config = Object.assign({ prompt: document.getElementById('cfg-prompt').value.trim() }, readGalleryConfigFields(false));
    if (DRAW_BG_PENDING) {
      setLoading(true, '上傳背景圖中…');
      api('uploadFile', { base64Data: DRAW_BG_PENDING.base64, mimeType: DRAW_BG_PENDING.mimeType, fileName: 'background.jpg', folderName: '手繪背景圖_' + title, classId: STATE.currentClass.id, categoryId: STATE.activeCategoryId }).then(function (r) {
        setLoading(false);
        if (r.success) config.backgroundImageFileId = r.fileId;
        doCreate();
      });
    } else {
      doCreate();
    }
  } else if (type === 'QUIZ') {
    config = { prompt: document.getElementById('cfg-prompt').value.trim() }; doCreate();
  }
}

function extractYoutubeId(url) {
  var m = String(url).match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : '';
}

function submitEditTask(taskId) {
  var t = STATE.tasks.find(function (x) { return x.id === taskId; });
  if (!t) return;
  var title = document.getElementById('ecfg-title').value.trim();
  var desc = document.getElementById('ecfg-desc').value.trim();
  if (!title) return toast('請輸入任務標題', 'error');
  var config = Object.assign({}, t.config);

  function doUpdate() {
    setLoading(true);
    api('updateTask', taskId, { title: title, description: desc, config: config }).then(function (res) {
      setLoading(false);
      if (!res.success) return toast(res.message, 'error');
      t.title = title; t.description = desc; t.config = config;
      closeModal(); toast('任務已更新！', 'success');
      renderTaskGrid();
    });
  }

  if (t.type === 'LINK') {
    var url = document.getElementById('ecfg-url').value.trim();
    if (!url) return toast('請輸入連結網址', 'error');
    if (!isSafeHttpUrl(url)) return toast('連結網址必須以 http:// 或 https:// 開頭', 'error');
    config.url = url; doUpdate();
  } else if (t.type === 'PDF') {
    var fileInput = document.getElementById('ecfg-pdf');
    if (fileInput && fileInput.files[0]) {
      var btn = document.getElementById('edit-task-submit-btn');
      var wrap = document.getElementById('epdf-progress-wrap');
      var bar = document.getElementById('epdf-progress-bar');
      var text = document.getElementById('epdf-progress-text');
      if (btn) btn.disabled = true;
      if (wrap) wrap.classList.remove('hidden');
      convertAndUploadPdf(fileInput.files[0], title, function (percent, statusText) {
        if (bar) bar.style.width = percent + '%';
        if (text) text.textContent = statusText;
      }, t.classId, t.categoryId).then(function (result) {
        config.pageFileIds = result.pageFileIds; config.totalPages = result.totalPages;
        doUpdate();
      }).catch(function (err) {
        if (btn) btn.disabled = false;
        toast('PDF 轉換上傳失敗：' + err, 'error');
      });
    } else {
      doUpdate();
    }
  } else if (t.type === 'FILE_SHARE') {
    var shareFileInput = document.getElementById('ecfg-file');
    if (shareFileInput && shareFileInput.files[0]) {
      var eShareFile = shareFileInput.files[0];
      if (eShareFile.size > FILE_SHARE_MAX_BYTES) return toast('檔案過大（上限 20MB），請改用較小的檔案', 'error');
      setLoading(true, '上傳檔案中…');
      readFileAsBase64(eShareFile).then(function (base64) {
        return api('uploadFile', { base64Data: base64, mimeType: eShareFile.type || 'application/octet-stream', fileName: eShareFile.name, folderName: '分享檔案_' + title, classId: t.classId, categoryId: t.categoryId });
      }).then(function (r) {
        setLoading(false);
        if (!r.success) return toast(r.message, 'error');
        config.fileId = r.fileId; config.fileName = r.fileName; config.mimeType = eShareFile.type || '';
        doUpdate();
      }).catch(function (err) {
        setLoading(false);
        toast('檔案上傳失敗：' + err, 'error');
      });
    } else {
      doUpdate();
    }
  } else if (t.type === 'YOUTUBE') {
    var yturl = document.getElementById('ecfg-yturl').value.trim();
    if (!yturl) return toast('請輸入 YouTube 網址', 'error');
    var eHasQuizChk = document.getElementById('ecfg-yt-hasquiz');

  } else if (t.type === 'QUIZ') {
    config.prompt = document.getElementById('ecfg-prompt').value.trim(); doUpdate();
  } else if (t.type === 'PHOTO_TEXT') {
    config.prompt = document.getElementById('ecfg-prompt').value.trim();

  } else if (t.type === 'DRAWING') {

/* ---- 圖文回應／手繪任務共用：作品藝廊公開程度（不公開／公開／完全公開）+ 自訂公開名稱 ---- */
function galleryConfigFieldsHtml(config, isEdit) {
  var modeId = isEdit ? 'ecfg-gallery-mode' : 'cfg-gallery-mode';
  var labelId = isEdit ? 'ecfg-gallery-label' : 'cfg-gallery-label';
  var wrapId = isEdit ? 'ecfg-gallery-label-wrap' : 'cfg-gallery-label-wrap';
  var mode = 'off';
  if (isEdit && config) mode = config.galleryFullyPublic ? 'public' : (config.galleryPublished ? 'class' : 'off');
  var label = isEdit && config ? (config.galleryLabel || '') : '';
  return '<div class="border-t border-slate-100 pt-3 mt-1">' +
    '<label class="text-sm font-bold text-slate-600 block mb-1">🖼️ 作品藝廊公開程度</label>' +
    '<select id="' + modeId + '" onchange="toggleGalleryLabelField(\'' + modeId + '\',\'' + wrapId + '\')" class="w-full border-2 border-blue-100 rounded-xl px-3 py-2 text-sm mb-1">' +
      '<option value="off"' + (mode === 'off' ? ' selected' : '') + '>不公開</option>' +
      '<option value="class"' + (mode === 'class' ? ' selected' : '') + '>公開（僅本班已登入學生可見）</option>' +

    ) : '') +

function handleDrawBgFile(file) {
  if (!file) return;
  compressImageFile(file, 1200).then(function (r) {
    DRAW_BG_PENDING = r;
    DRAW_BG_REMOVE = false;
    var cur = document.getElementById('draw-bg-current');
    if (cur) cur.remove();
    renderDrawBgPreview();
  });
}

function renderDrawBgPreview() {
  var el = document.getElementById('draw-bg-preview');
  if (!el) return;
  if (!DRAW_BG_PENDING) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="relative inline-block"><img src="' + DRAW_BG_PENDING.base64 + '" class="h-20 rounded-lg border"><button type="button" onclick="clearDrawBgPending()" class="absolute -top-2 -right-2 w-6 h-6 bg-red-500 text-white rounded-full text-xs font-bold">✕</button></div>';
}

function clearDrawBgPending() { DRAW_BG_PENDING = null; renderDrawBgPreview(); }

function markDrawBgRemove() {
  DRAW_BG_REMOVE = true;
  var cur = document.getElementById('draw-bg-current');
  if (cur) cur.innerHTML = '<span class="text-xs text-orange-500 font-bold">將於儲存後移除背景圖</span>';
}

// 只要「背景圖」拖放區存在於目前畫面上，就允許直接按 Ctrl+V 貼上剪貼簿圖片
document.addEventListener('paste', function (e) {
  var zone = document.getElementById('draw-bg-dropzone');
  if (!zone) return;
  var clipboardData = e.clipboardData || window.clipboardData;
  if (!clipboardData || !clipboardData.items) return;
  for (var i = 0; i < clipboardData.items.length; i++) {
    if (clipboardData.items[i].type && clipboardData.items[i].type.indexOf('image') !== -1) {
      var blob = clipboardData.items[i].getAsFile();
      if (blob) { handleDrawBgFile(blob); e.preventDefault(); }
      break;
    }
  }
});

/* ---- AI 出題提示詞產生器（僅產生提示詞文字供複製，不呼叫任何 AI API） ---- */
function buildAiPromptText(subtitleText, count) {
  return '你是一位教學設計助教。請根據以下影片字幕／逐字稿內容，出 ' + count + ' 題「單選題」，用來檢測學生對這段內容的理解程度。\n\n' +
    '【格式要求，請務必嚴格遵守，輸出將直接用於系統批次匯入】\n' +
    '1. 每題各佔一行，欄位之間以半形逗號「,」分隔，順序如下：\n' +
    '   題幹,選項A,選項B,選項C,選項D,正解,詳解\n' +
    '2. 正解欄位只能填英文字母 A、B、C 或 D（對應選項A~D其中之一）。\n' +
    '3. 詳解請用一句話簡短說明正解依據（20字以內），若無法判斷可留空但仍需保留該欄逗號。\n' +
    '4. 四個選項都必須填寫，且只有一個是正確答案，其餘為合理的干擾選項。\n' +
    '5. 若題幹或選項內容本身包含逗號，請將該欄位以雙引號 " 包起來。\n' +
    '6. 不要輸出標題列，也不要加上任何說明文字、編號或 Markdown 符號，直接輸出 ' + count + ' 行資料即可。\n\n' +
    '【影片字幕／逐字稿內容】\n' + subtitleText;
}

function generateAiPrompt() {
  var subtitle = document.getElementById('ai-subtitle').value.trim();
  if (!subtitle) return toast('請先貼上影片字幕或逐字稿內容', 'error');
  var count = Math.max(1, Math.min(20, Number(document.getElementById('ai-count').value) || 5));
  document.getElementById('ai-prompt-output').value = buildAiPromptText(subtitle, count);
  document.getElementById('ai-prompt-wrap').classList.remove('hidden');
}

function copyAiPrompt() {
  var ta = document.getElementById('ai-prompt-output');
  if (!ta || !ta.value) return;
  ta.focus();
  ta.select();
  var done = function () { toast('已複製提示詞，快去貼給 AI 工具吧！', 'success'); };
  var fallback = function () {
    try { document.execCommand('copy'); done(); } catch (e) { toast('複製失敗，請手動選取後複製', 'error'); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ta.value).then(done).catch(fallback);
  } else {
    fallback();
  }
}

/* ---- 單題新增／編輯 ---- */
function editQuestion(qid) {
  var q = QUESTION_CACHE[qid];
  if (!q) return;
  document.getElementById('q-edit-id').value = q.id;
  document.getElementById('q-text').value = q.text;
  document.getElementById('q-a').value = q.options[0] || '';
  document.getElementById('q-b').value = q.options[1] || '';
  document.getElementById('q-c').value = q.options[2] || '';
  document.getElementById('q-d').value = q.options[3] || '';
  document.getElementById('q-ans').value = q.answer;
  document.getElementById('q-exp').value = q.explanation || '';
  var tsInput = document.getElementById('q-ts');
  if (tsInput && tsInput.type === 'number') tsInput.value = q.timestamp === null ? '' : q.timestamp;
  document.getElementById('q-form-title').textContent = '✏️ 編輯題目';
  document.getElementById('q-submit-btn').textContent = '💾 更新這一題';
  document.getElementById('q-cancel-btn').classList.remove('hidden');
  document.getElementById('q-text').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function cancelEditQuestion(taskId, taskType) {
  openQuestionManager(taskId, taskType);
}

function addSingleQuestion(taskId, taskType) {
  var editId = document.getElementById('q-edit-id').value;
  var text = document.getElementById('q-text').value.trim();
  var a = document.getElementById('q-a').value.trim(), b = document.getElementById('q-b').value.trim(), c = document.getElementById('q-c').value.trim(), d = document.getElementById('q-d').value.trim();
  if (!text || !a || !b) return toast('請至少填寫題幹與選項A、B', 'error');
  var ans = document.getElementById('q-ans').value;
  var ts = document.getElementById('q-ts').value;
  var exp = document.getElementById('q-exp').value.trim();
  setLoading(true);
  api('saveQuizQuestion', { id: editId || '', taskId: taskId, text: text, options: [a, b, c, d], answer: ans, explanation: exp, timestamp: ts === '' ? null : Number(ts) }).then(function (res) {
    setLoading(false);
    if (res.success) openQuestionManager(taskId, taskType); else toast(res.message, 'error');
  });
}

function importCsvQuestions(taskId, taskType) {
  var csv = document.getElementById('q-csv').value.trim();
  if (!csv) return toast('請貼上 CSV 內容', 'error');
  setLoading(true);
  api('batchImportQuizQuestions', taskId, csv).then(function (res) {
    setLoading(false);
    if (res.success) { toast(res.message, 'success'); openQuestionManager(taskId, taskType); }
    else toast(res.message, 'error');
  });
}

function deleteQuestionAndRefresh(qid, taskId, taskType) {
  api('deleteQuizQuestion', qid).then(function (res) {
    if (res.success) openQuestionManager(taskId, taskType); else toast(res.message, 'error');
  });
}

// 點擊小圖才開啟該生的大圖唯讀檢視。
var TPDFV = { pageFileIds: [], page: 0, total: 0, students: [], annotations: {} };

function openTeacherPdfNotes(taskId) {

    setLoading(false);

    var students = rs[1].success ? rs[1].data : [];

      '<div class="h-full flex flex-col p-4 sm:p-6">' +
        '<div class="flex items-start justify-between gap-2 mb-3 flex-wrap pr-12 flex-shrink-0">' +
          '<div class="text-lg font-bold">👀 全班閱讀筆記檢核（唯讀）</div>' +
          '<div class="text-xs text-slate-400">點擊任一位學生的小圖可放大檢視該頁完整畫記。</div>' +
        '</div>' +
        '<div class="flex items-center justify-between mb-3 flex-shrink-0">' +
          '<button onclick="tpdfGridPrevPage()" class="px-4 py-2 rounded-xl bg-slate-100 font-bold">‹ 上一頁</button>' +
          '<div class="font-bold text-slate-500" id="tpv-page-indicator">頁 1 / ' + TPDFV.total + '</div>' +
          '<button onclick="tpdfGridNextPage()" class="px-4 py-2 rounded-xl bg-slate-100 font-bold">下一頁 ›</button>' +
        '</div>' +
        '<div id="tpv-grid" class="grid grid-cols-[repeat(auto-fill,minmax(280px,1fr))] gap-4 flex-1 min-h-0 overflow-y-auto content-start"></div>' +
      '</div>',
      { fullscreen: true }
    );
    tpdfRenderGridPage(0);
  });
}

function tpdfRenderGridPage(idx) {
  TPDFV.page = idx;
  var indicator = document.getElementById('tpv-page-indicator');
  if (indicator) indicator.textContent = '頁 ' + (idx + 1) + ' / ' + TPDFV.total;
  var grid = document.getElementById('tpv-grid');
  if (!grid) return;
  grid.innerHTML = TPDFV.students.map(function (s) {
    return '<div class="cursor-pointer card-hover" onclick="openTpdfFullView(\'' + s.id + '\')">' +
      '<div class="relative border-2 border-blue-100 rounded-xl overflow-hidden bg-slate-50">' +
        '<img data-student-id="' + s.id + '" class="w-full block tpv-thumb-img">' +
        '<canvas class="absolute top-0 left-0 tpv-thumb-canvas"></canvas>' +
      '</div>' +
      '<div class="text-sm font-bold text-slate-600 text-center mt-1.5 truncate">' + escapeHtml(s.name) + '</div>' +
    '</div>';
  }).join('');

  Array.prototype.forEach.call(grid.querySelectorAll('.tpv-thumb-img'), function (img) {
    var sid = img.getAttribute('data-student-id');
    img.onload = function () {
      var canvas = img.nextElementSibling;
      canvas.width = img.offsetWidth || img.clientWidth || 200;
      canvas.height = img.offsetHeight || img.clientHeight || 260;
      var ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var pagesRaw = (TPDFV.annotations[sid] || {}).pages || {};
      var raw = pagesRaw[idx];
      if (!raw) return;
      try {
        var paths = JSON.parse(raw);
        paths.forEach(function (p) { renderPdfPath(ctx, canvas.width, canvas.height, p); });
      } catch (e) {}
    };
    img.src = 'https://drive.google.com/thumbnail?id=' + TPDFV.pageFileIds[idx] + '&sz=w1000';
  });
}

function tpdfGridPrevPage() { if (TPDFV.page > 0) tpdfRenderGridPage(TPDFV.page - 1); }
function tpdfGridNextPage() { if (TPDFV.page < TPDFV.total - 1) tpdfRenderGridPage(TPDFV.page + 1); }

var TPDFV_FULL = null;

// 放大檢視獨立於 modal-root 之外的圖層（比照作品藝廊小圖放大 openImageLightbox 的作法），
// 疊在「全班閱讀筆記檢核」全螢幕視窗之上，關閉時只移除這一層，不會連帶關掉底下的全班檢核畫面。
function openTpdfFullView(studentId) {
  var s = TPDFV.students.find(function (x) { return x.id === studentId; });
  var pagesRaw = (TPDFV.annotations[studentId] || {}).pages || {};
  var strokes = {};
  Object.keys(pagesRaw).forEach(function (p) { try { strokes[p] = JSON.parse(pagesRaw[p]); } catch (e) {} });
  TPDFV_FULL = { pageFileIds: TPDFV.pageFileIds, page: TPDFV.page, total: TPDFV.total, strokes: strokes, studentName: s ? s.name : '' };
  closeTpdfFullView();
  var el = document.createElement('div');
  el.id = 'tpvf-root';
  el.className = 'fixed inset-0 z-[950] bg-black/85 flex flex-col items-center p-4 fade-in';
  el.innerHTML =
    '<button onclick="closeTpdfFullView()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/90 hover:bg-white font-bold text-slate-700 shadow-lg z-10">✕</button>' +
    '<div class="text-white font-bold text-lg mt-1 mb-3 flex-shrink-0">👀 ' + escapeHtml(TPDFV_FULL.studentName) + ' 的閱讀筆記（唯讀）</div>' +
    '<div class="flex-1 min-h-0 w-full flex items-center justify-center">' +
      '<div class="relative inline-block">' +
        '<img id="tpvf-page-img" class="block" style="max-width:85vw;max-height:70vh;width:auto;height:auto;">' +
        '<canvas id="tpvf-overlay" class="absolute top-0 left-0"></canvas>' +
      '</div>' +
    '</div>' +
    '<div class="flex items-center justify-between mt-3 w-full max-w-xl flex-shrink-0">' +
      '<button onclick="tpdfFullPrevPage()" class="px-4 py-2 rounded-xl bg-white/90 hover:bg-white font-bold">‹ 上一頁</button>' +
      '<div class="font-bold text-white" id="tpvf-page-indicator">頁 1 / ' + TPDFV_FULL.total + '</div>' +
      '<button onclick="tpdfFullNextPage()" class="px-4 py-2 rounded-xl bg-white/90 hover:bg-white font-bold">下一頁 ›</button>' +
    '</div>';
  el.addEventListener('click', function (e) { if (e.target === el) closeTpdfFullView(); });
  document.body.appendChild(el);
  tpdfFullRenderPage(TPDFV_FULL.page);
}

function closeTpdfFullView() {
  var el = document.getElementById('tpvf-root');
  if (el) el.remove();
}

function tpdfFullRenderPage(idx) {
  TPDFV_FULL.page = idx;
  var indicator = document.getElementById('tpvf-page-indicator');
  if (indicator) indicator.textContent = '頁 ' + (idx + 1) + ' / ' + TPDFV_FULL.total;
  var img = document.getElementById('tpvf-page-img');
  img.onload = function () {
    var canvas = document.getElementById('tpvf-overlay');
    canvas.width = img.offsetWidth || 800; canvas.height = img.offsetHeight || 1100;
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var paths = TPDFV_FULL.strokes[idx] || [];
    paths.forEach(function (p) { renderPdfPath(ctx, canvas.width, canvas.height, p); });
  };
  img.src = 'https://drive.google.com/thumbnail?id=' + TPDFV_FULL.pageFileIds[idx] + '&sz=w1600';
}

function tpdfFullPrevPage() { if (TPDFV_FULL.page > 0) tpdfFullRenderPage(TPDFV_FULL.page - 1); }
function tpdfFullNextPage() { if (TPDFV_FULL.page < TPDFV_FULL.total - 1) tpdfFullRenderPage(TPDFV_FULL.page + 1); }

function saveStudentLoginSettings() {
  var radios = document.getElementsByName('stu-login-mode');
  var noPwd = false;
  for (var i = 0; i < radios.length; i++) {
    if (radios[i].checked && radios[i].value === 'nopwd') {
      noPwd = true;
      break;

  }
  setLoading(true);
  api('setStudentLoginSettings', noPwd).then(function (res) {
    setLoading(false);
    if (res.success) {
      toast(res.message, 'success');
      closeModal();
    } else {
      toast(res.message, 'error');

}

function renderGradingTab(body) {
  body.innerHTML =
    '<div class="flex gap-2 mb-4">' +
      '<button id="gt-overview-btn" onclick="switchGradingSub(\'overview\')" class="px-4 py-2 rounded-xl font-bold bg-white text-slate-500">全班進度總覽</button>' +
      '<button id="gt-task-btn" onclick="switchGradingSub(\'task\')" class="px-4 py-2 rounded-xl font-bold bg-white text-slate-500">依任務批改</button>' +
    '</div>' +
    '<div id="grading-sub-body"></div>';
  STATE.gradingSub = STATE.gradingSub || 'overview';
  switchGradingSub(STATE.gradingSub);
}

function switchGradingSub(sub) {
  STATE.gradingSub = sub;
  var ob = document.getElementById('gt-overview-btn'), tb = document.getElementById('gt-task-btn');
  if (ob && tb) { ob.className = 'px-4 py-2 rounded-xl font-bold ' + (sub === 'overview' ? 'tab-active' : 'bg-white text-slate-500'); tb.className = 'px-4 py-2 rounded-xl font-bold ' + (sub === 'task' ? 'tab-active' : 'bg-white text-slate-500'); }
  if (sub === 'overview') renderOverviewMatrix(); else renderTaskGradingPicker();
}

function buildOverviewTable(tasks, students, matrix) {
  return '<div class="card p-4 overflow-x-auto"><table class="text-sm border-collapse"><thead><tr>' +
      '<th class="sticky left-0 bg-white p-2 text-left border-b-2 border-slate-100">學生 ＼ 任務</th>' +
      tasks.map(function (t) {
        var canBatchGrade = t.type !== 'QUIZ' && t.type !== 'YOUTUBE';
        return '<th class="p-2 text-center border-b-2 border-slate-100 whitespace-nowrap font-bold text-slate-500">' + getTaskTypeMeta(t.type).icon + '<br>' + escapeHtml(t.title) +
          (canBatchGrade ? '<br><button onclick="openBatchGradeModal(\'' + t.id + '\')" class="mt-1 text-[10px] font-bold px-2 py-1 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 whitespace-nowrap">🗂 批次批改</button>' : '') +
        '</th>';
      }).join('') +
    '</tr></thead><tbody>' +
    students.map(function (s) {
      return '<tr>' + '<td class="sticky left-0 bg-white p-2 font-bold border-b border-slate-50">' + escapeHtml(s.name) + '</td>' +
        tasks.map(function (t) {
          var sub = matrix[s.id] && matrix[s.id][t.id];
          var status = sub ? sub.status : '未完成';
          var resultText = gradeResultText(sub);
          return '<td class="p-1.5 text-center border-b border-slate-50">' +
            '<button onclick="openGradeModalFor(\'' + t.id + '\',\'' + s.id + '\')" class="status-' + status + ' font-bold text-xs px-2.5 py-1.5 rounded-lg whitespace-nowrap">' + status + (resultText ? ' ' + resultText : '') + '</button>' +
          '</td>';
        }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
}

// 全班進度總覽：依「分類 → 任務」分組呈現，而非把所有任務混在同一張表格裡
function renderOverviewMatrix() {
  var classId = STATE.currentClass.id;
  var el = document.getElementById('grading-sub-body');
  if (!GRADING_CACHE[classId]) el.innerHTML = '<div class="text-slate-400 text-center py-8">載入中…</div>';
  loadWithCache(GRADING_CACHE, classId, function () { return api('getClassOverview', classId); }, function (res) {
    if (!STATE.currentClass || STATE.currentClass.id !== classId || STATE.teacherClassTab !== 'grading' || STATE.gradingSub !== 'overview') return;
    var el = document.getElementById('grading-sub-body');
    if (!el) return;
    var d = res.data;
    if (d.students.length === 0 || d.tasks.length === 0) { el.innerHTML = '<div class="card p-8 text-center text-slate-400">尚無學生或任務資料</div>'; return; }

    var cats = STATE.categories.slice().sort(function (a, b) { return a.order - b.order; });
    var html = '';
    cats.forEach(function (c) {
      var catTasks = d.tasks.filter(function (t) { return t.categoryId === c.id; });
      if (catTasks.length === 0) return;
      html += '<div class="mb-6"><div class="font-black text-blue-800 mb-2">' + escapeHtml(c.name) + '</div>' + buildOverviewTable(catTasks, d.students, d.matrix) + '</div>';
    });
    var uncategorized = d.tasks.filter(function (t) { return !cats.some(function (c) { return c.id === t.categoryId; }); });
    if (uncategorized.length > 0) {
      html += '<div class="mb-6"><div class="font-black text-slate-500 mb-2">未分類任務</div>' + buildOverviewTable(uncategorized, d.students, d.matrix) + '</div>';
    }
    el.innerHTML = html || '<div class="card p-8 text-center text-slate-400">尚無任務資料</div>';
  }, function (msg) {
    var el = document.getElementById('grading-sub-body');
    if (el) el.innerHTML = '<div class="text-red-500">' + msg + '</div>';
  });
}

// 依任務批改：先選分類，再選該分類內的任務
function renderTaskGradingPicker() {
  var el = document.getElementById('grading-sub-body');
  var cats = STATE.categories.slice().sort(function (a, b) { return a.order - b.order; });
  var catOptions = cats.map(function (c) { return '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>'; }).join('');
  el.innerHTML = '<div class="card p-4 mb-4 grid grid-cols-1 sm:grid-cols-2 gap-3">' +
      '<div><label class="text-xs font-bold text-slate-500">1. 選擇分類</label>' +
        '<select id="gt-cat-select" onchange="renderGradingTaskOptions(this.value)" class="w-full border-2 border-blue-100 rounded-xl px-4 py-2.5 mt-1"><option value="">請選擇分類</option>' + catOptions + '</select></div>' +
      '<div><label class="text-xs font-bold text-slate-500">2. 選擇任務</label>' +
        '<select id="gt-task-select" onchange="renderTaskSubmissionList(this.value)" class="w-full border-2 border-blue-100 rounded-xl px-4 py-2.5 mt-1"><option value="">請先選擇分類</option></select></div>' +
    '</div>' +
    '<div id="task-sub-list"></div>';
}

function renderGradingTaskOptions(categoryId) {
  var taskSelect = document.getElementById('gt-task-select');
  var listEl = document.getElementById('task-sub-list');
  if (listEl) listEl.innerHTML = '';
  if (!categoryId) { taskSelect.innerHTML = '<option value="">請先選擇分類</option>'; return; }
  var tasks = STATE.tasks.filter(function (t) { return t.categoryId === categoryId; }).sort(function (a, b) { return a.order - b.order; });
  if (tasks.length === 0) { taskSelect.innerHTML = '<option value="">此分類尚無任務</option>'; return; }
  taskSelect.innerHTML = '<option value="">請選擇任務</option>' + tasks.map(function (t) { return '<option value="' + t.id + '">' + getTaskTypeMeta(t.type).icon + ' ' + escapeHtml(t.title) + '</option>'; }).join('');
}

function buildSubmissionListHtml(subs, task) {

}

// 手繪任務：以所有回應的小圖矩陣呈現，點擊小圖查看完整內容並評分
function buildDrawingSubmissionGrid(subs, task) {

        '<span class="absolute top-1 right-1 status-' + s.status + ' text-[10px] font-black px-1.5 py-0.5 rounded">' + s.status + '</span>' +

// 圖文回應任務：直接列出所有人的文字內容，點擊查看完整內容（含照片）並評分
function buildPhotoTextSubmissionList(subs, task) {
  if (subs.length === 0) return '<div class="card p-8 text-center text-slate-400">尚無學生繳交</div>';
  return '<div class="space-y-3">' + subs.map(function (s) {
    TASK_SUB_CACHE[s.id] = s;
    var c = s.content || {};

        '<div class="font-bold text-slate-700">' + escapeHtml(s.studentName) + '</div>' +

// YouTube 隨堂考：逐題正確率與答錯名單統計，並列出每位學生的觀看時長
// QUIZ 與 YOUTUBE 共用：逐題正確率與答錯名單統計；YOUTUBE 另外附上每位學生的觀看時長
function buildQuizSubmissionReport(subs, task, questions) {
  if (subs.length === 0) return '<div class="card p-8 text-center text-slate-400">尚無學生繳交</div>';

  var qStats = {};
  var qOrder = [];
  questions.forEach(function (q) { qStats[q.id] = { text: q.text, correctCount: 0, total: 0, wrongNames: [] }; qOrder.push(q.id); });
  subs.forEach(function (s) {
    var answers = (s.content && s.content.answers) || [];
    answers.forEach(function (a) {
      if (!qStats[a.questionId]) { qStats[a.questionId] = { text: a.text, correctCount: 0, total: 0, wrongNames: [] }; qOrder.push(a.questionId); }
      qStats[a.questionId].total++;
      if (a.correct) qStats[a.questionId].correctCount++;
      else qStats[a.questionId].wrongNames.push(s.studentName);
    });
  });

  var statsHtml = qOrder.length === 0 ? '' : ('<div class="space-y-2 mb-5">' + qOrder.map(function (qId, i) {
    var st = qStats[qId];
    var rate = st.total > 0 ? Math.round(st.correctCount / st.total * 100) : 0;
    return '<div class="border border-slate-100 rounded-xl p-3">' +
      '<div class="font-bold text-sm mb-1">第 ' + (i + 1) + ' 題　正確率 ' + rate + '%（' + st.correctCount + ' / ' + st.total + ' 人）</div>' +
      '<div class="text-xs text-slate-500 mb-1">' + escapeHtml(st.text) + '</div>' +
      (st.wrongNames.length > 0 ? '<div class="text-xs text-red-500 font-bold">❌ 答錯：' + st.wrongNames.map(escapeHtml).join('、') + '</div>' : '<div class="text-xs text-green-500 font-bold">✅ 全班答對</div>') +
    '</div>';
  }).join('') + '</div>');

  var listHtml = '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">' + subs.map(function (s) {
    TASK_SUB_CACHE[s.id] = s;
    var watchedLine = task.type === 'YOUTUBE' ? ('<div class="text-xs text-slate-400">🎬 觀看時長 ' + fmtMinSec(s.content && s.content.watchedSeconds) + '</div>') : '';
    return '<div class="card p-4 flex justify-between items-center cursor-pointer" onclick="openGradeModal(TASK_SUB_CACHE[\'' + s.id + '\'],\'' + task.type + '\')">' +
      '<div><div class="font-bold text-slate-700">' + escapeHtml(s.studentName) + '</div>' + watchedLine + '</div>' +
      '<span class="status-' + s.status + ' font-bold text-xs px-3 py-1.5 rounded-lg">' + s.status + (gradeResultText(s) ? ' ' + gradeResultText(s) : '') + '</span>' +
    '</div>';
  }).join('') + '</div>';

  return statsHtml + listHtml;
}

// 依任務類型分派至專屬呈現方式；QUIZ／YOUTUBE 需另外取得題庫（含正解）才能統計正確率
function buildSubmissionsViewHtml(subs, task, questions) {
  if (task.type === 'DRAWING') return buildDrawingSubmissionGrid(subs, task);
  if (task.type === 'PHOTO_TEXT') return buildPhotoTextSubmissionList(subs, task);
  if (task.type === 'QUIZ' || task.type === 'YOUTUBE') return buildQuizSubmissionReport(subs, task, questions || []);
  return buildSubmissionListHtml(subs, task);
}

function fetchSubmissionsView(task) {
  var extra = (task.type === 'QUIZ' || task.type === 'YOUTUBE') ? api('getQuizQuestions', task.id) : Promise.resolve({ success: true, data: [] });
  return Promise.all([api('getSubmissionsForTask', task.id), extra]).then(function (rs) {
    if (!rs[0].success) return { success: false, message: rs[0].message };
    var questions = (rs[1].data || []).slice().sort(function (a, b) { return a.order - b.order; });
    return { success: true, html: buildSubmissionsViewHtml(rs[0].data, task, questions) };
  });
}

function renderTaskSubmissionList(taskId) {
  var container = document.getElementById('task-sub-list');
  if (!container) return;
  if (!taskId) { container.innerHTML = ''; return; }
  container.innerHTML = '<div class="text-slate-400 text-center py-8">載入中…</div>';
  var task = STATE.tasks.find(function (t) { return t.id === taskId; });
  fetchSubmissionsView(task).then(function (res) {
    // 若使用者在資料載入完成前已切換分頁／任務，此容器可能已經不存在，此時不要再寫入畫面
    var stillThere = document.getElementById('task-sub-list');
    if (!stillThere) return;
    stillThere.innerHTML = res.success ? res.html : '<div class="text-red-500">' + res.message + '</div>';
  });
}

// 任務卡片捷徑：直接彈出該任務所有學生的繳交狀況，可直接查看內容、評分並加評語
function openTaskSubmissionsModal(taskId) {
  var task = STATE.tasks.find(function (t) { return t.id === taskId; });
  if (!task) return;
  setLoading(true);
  fetchSubmissionsView(task).then(function (res) {
    setLoading(false);
    if (!res.success) return toast(res.message, 'error');
    var hint = task.type === 'DRAWING' ? '點擊小圖查看完整內容並評分'
      : (task.type === 'QUIZ' || task.type === 'YOUTUBE') ? '各題正確率統計如下，點選學生可查看作答詳情（系統自動批改，無需人工評分）'
      : task.type === 'PHOTO_TEXT' ? '點選項目查看完整內容（含照片）並評分'
      : '點選學生右側狀態按鈕即可查看繳交內容、評分並加上評語';
    openModal(
      '<div class="text-lg font-bold mb-1">' + getTaskTypeMeta(task.type).icon + ' ' + escapeHtml(task.title) + ' — 學生繳交狀況</div>' +
      '<div class="text-xs text-slate-400 mb-4">' + hint + '</div>' +
      res.html,
      { wide: true }
    );
  });
}

function openGradeModalFor(taskId, studentId) {
  var task = STATE.tasks.find(function (t) { return t.id === taskId; });
  setLoading(true);
  api('getSubmission', taskId, studentId).then(function (res) {
    setLoading(false);
    if (!res.success) return toast(res.message, 'error');
    if (!res.data) return toast('此學生尚未提交此任務', 'warn');
    openGradeModal(JSON.stringify(res.data), task.type);
  });
}

function openGradeModal(subJson, taskType) {
  var s = typeof subJson === 'string' ? JSON.parse(subJson) : subJson;
  var previewHtml = renderSubmissionPreview(s, taskType);

  // 自動閱卷測驗與 YouTube 隨堂考由系統自動批改，教師端不再提供人工評分，僅供查看結果
  if (taskType === 'QUIZ' || taskType === 'YOUTUBE') {
    openModal(
      '<div class="text-lg font-bold mb-1">' + escapeHtml(s.studentName) + ' 的作答結果</div>' +
      '<div class="text-xs text-slate-400 mb-4">提交於 ' + fmtDate(s.submittedAt) + '（系統自動批改，無需人工評分）</div>' +
      previewHtml,
      { wide: true }
    );
    return;
  }

  // 依既有資料判斷上次是用哪種評分方式評的分，重新開啟批改視窗時要還原該模式與已填入的值，
  // 而不是每次都預設顯示「分數」模式（否則會讓人誤以為之前的評分「不見了」）
  var mode = detectGradeMode(s);
  openModal(
    '<div class="text-lg font-bold mb-1">批改：' + escapeHtml(s.studentName) + '</div>' +
    '<div class="text-xs text-slate-400 mb-4">提交於 ' + fmtDate(s.submittedAt) + '</div>' +
    '<div class="mb-4">' + previewHtml + '</div>' +
    '<div class="border-t pt-4">' +
      '<label class="text-sm font-bold text-slate-500">評分方式</label>' +
      '<select id="gr-mode" onchange="switchGradeMode()" class="w-full border-2 border-blue-100 rounded-xl px-4 py-2.5 mt-1 mb-3">' +
        '<option value="score"' + (mode === 'score' ? ' selected' : '') + '>分數（0~100）</option>' +
        '<option value="level"' + (mode === 'level' ? ' selected' : '') + '>等級（A/B/C）</option>' +
        '<option value="pass"' + (mode === 'pass' ? ' selected' : '') + '>通過／未通過</option>' +
      '</select>' +
      '<div id="gr-score-wrap" class="' + (mode === 'score' ? '' : 'hidden') + '"><input id="gr-score" type="number" min="0" max="100" value="' + (s.score !== null && s.score !== '' ? s.score : '') + '" placeholder="分數" class="w-full border-2 border-blue-100 rounded-xl px-4 py-2.5 mb-3"></div>' +
      '<div id="gr-level-wrap" class="' + (mode === 'level' ? '' : 'hidden') + '">' +
        '<select id="gr-level" class="w-full border-2 border-blue-100 rounded-xl px-4 py-2.5 mb-3">' +
          ['A', 'B', 'C'].map(function (l) { return '<option value="' + l + '"' + (s.level === l ? ' selected' : '') + '>' + l + '</option>'; }).join('') +
        '</select></div>' +
      '<div id="gr-pass-wrap" class="' + (mode === 'pass' ? '' : 'hidden') + '">' +
        '<select id="gr-pass" class="w-full border-2 border-blue-100 rounded-xl px-4 py-2.5 mb-3">' +
          '<option value="通過"' + (s.level === '通過' ? ' selected' : '') + '>通過</option>' +
          '<option value="未通過"' + (s.level === '未通過' ? ' selected' : '') + '>未通過</option>' +
        '</select></div>' +
      '<label class="text-sm font-bold text-slate-500">回饋評語</label>' +
      '<textarea id="gr-comment" rows="2" class="w-full border-2 border-blue-100 rounded-xl px-4 py-2.5 mt-1 mb-4">' + escapeHtml(s.comment) + '</textarea>' +
      '<div class="flex gap-3">' +
        '<button onclick="submitGrade(\'' + s.id + '\',\'退回\')" class="flex-1 py-3 rounded-xl bg-red-100 text-red-600 font-bold hover:bg-red-200">退回重修</button>' +
        '<button onclick="submitGrade(\'' + s.id + '\',\'已完成\')" class="flex-1 py-3 rounded-xl btn-primary">完成批改</button>' +
      '</div>' +
    '</div>', { wide: true }
  );
}

function detectGradeMode(s) {
  if (s.level === '通過' || s.level === '未通過') return 'pass';
  if (s.level === 'A' || s.level === 'B' || s.level === 'C') return 'level';
  return 'score';
}

function switchGradeMode() {
  var mode = document.getElementById('gr-mode').value;
  document.getElementById('gr-score-wrap').className = mode === 'score' ? '' : 'hidden';
  document.getElementById('gr-level-wrap').className = mode === 'level' ? '' : 'hidden';
  document.getElementById('gr-pass-wrap').className = mode === 'pass' ? '' : 'hidden';
}

function submitGrade(subId, status) {
  var mode = document.getElementById('gr-mode').value;
  var payload = { submissionId: subId, status: status, comment: document.getElementById('gr-comment').value.trim() };
  if (mode === 'score') payload.score = document.getElementById('gr-score').value === '' ? null : Number(document.getElementById('gr-score').value);
  else if (mode === 'level') payload.level = document.getElementById('gr-level').value;
  else payload.level = document.getElementById('gr-pass').value;
  setLoading(true);
  api('gradeSubmission', payload).then(function (res) {
    setLoading(false);
    if (res.success) {
      delete GRADING_CACHE[STATE.currentClass.id];
      closeModal(); toast(res.message, 'success');
      if (STATE.gradingSub === 'overview') renderOverviewMatrix();
      else { var sel = document.getElementById('gt-task-select'); if (sel && sel.value) renderTaskSubmissionList(sel.value); }
    } else toast(res.message, 'error');
  });
}

/* ============================================================
 * 9.5 批次批改：同一個介面依序批改全班，或一次把同一份評分套用給所有人
 * ============================================================ */
var BATCH_GRADE = null;

function openBatchGradeModal(taskId) {
  var task = STATE.tasks.find(function (t) { return t.id === taskId; });
  if (!task) return;
  if (task.type === 'QUIZ' || task.type === 'YOUTUBE') return toast('此任務類型由系統自動批改，不需要人工批次批改', 'warn');
  setLoading(true);
  api('getSubmissionsForTask', taskId).then(function (res) {
    setLoading(false);
    if (!res.success) return toast(res.message, 'error');
    if (res.data.length === 0) return toast('此任務目前尚無學生繳交，無法批次批改', 'warn');
    var subs = res.data.slice().sort(function (a, b) { return a.studentName.localeCompare(b.studentName, 'zh-Hant'); });
    BATCH_GRADE = { task: task, subs: subs, index: 0 };
    renderBatchGradeModal();
  });
}

function renderBatchGradeModal() {
  var bg = BATCH_GRADE;
  var s = bg.subs[bg.index];
  var mode = detectGradeMode(s);
  var meta = getTaskTypeMeta(bg.task.type);
  openModal(
    '<div class="text-lg font-bold mb-1">🗂 批次批改：' + meta.icon + ' ' + escapeHtml(bg.task.title) + '</div>' +
    '<div class="text-xs text-slate-400 mb-4">可逐一批改後點「儲存並前往下一位」依序完成全班；或是批改好一位之後，直接點下方「套用到全部學生」，把同一份分數／評語一次套用給所有已繳交的學生。</div>' +
    '<div class="flex items-center justify-between mb-3 gap-2">' +
      '<button onclick="batchGradeNav(-1)" ' + (bg.index === 0 ? 'disabled' : '') + ' class="px-4 py-2 rounded-xl bg-slate-100 font-bold ' + (bg.index === 0 ? 'opacity-40 cursor-not-allowed' : '') + '">‹ 上一位</button>' +
      '<div class="text-center">' +
        '<div class="font-black text-slate-700">' + escapeHtml(s.studentName) + '</div>' +
        '<div class="text-xs text-slate-400">第 ' + (bg.index + 1) + ' / ' + bg.subs.length + ' 位　<span class="status-' + s.status + ' font-bold px-2 py-0.5 rounded">' + s.status + (gradeResultText(s) ? ' ' + gradeResultText(s) : '') + '</span></div>' +
      '</div>' +
      '<button onclick="batchGradeNav(1)" ' + (bg.index === bg.subs.length - 1 ? 'disabled' : '') + ' class="px-4 py-2 rounded-xl bg-slate-100 font-bold ' + (bg.index === bg.subs.length - 1 ? 'opacity-40 cursor-not-allowed' : '') + '">下一位 ›</button>' +
    '</div>' +
    '<div class="mb-4">' + renderSubmissionPreview(s, bg.task.type) + '</div>' +
    '<div class="border-t pt-4">' +
      '<label class="text-sm font-bold text-slate-500">評分方式</label>' +
      '<select id="bg-mode" onchange="switchBatchGradeMode()" class="w-full border-2 border-blue-100 rounded-xl px-4 py-2.5 mt-1 mb-3">' +
        '<option value="score"' + (mode === 'score' ? ' selected' : '') + '>分數（0~100）</option>' +
        '<option value="level"' + (mode === 'level' ? ' selected' : '') + '>等級（A/B/C）</option>' +
        '<option value="pass"' + (mode === 'pass' ? ' selected' : '') + '>通過／未通過</option>' +
      '</select>' +
      '<div id="bg-score-wrap" class="' + (mode === 'score' ? '' : 'hidden') + '"><input id="bg-score" type="number" min="0" max="100" value="' + (s.score !== null && s.score !== '' ? s.score : '') + '" placeholder="分數" class="w-full border-2 border-blue-100 rounded-xl px-4 py-2.5 mb-3"></div>' +
      '<div id="bg-level-wrap" class="' + (mode === 'level' ? '' : 'hidden') + '">' +
        '<select id="bg-level" class="w-full border-2 border-blue-100 rounded-xl px-4 py-2.5 mb-3">' +
          ['A', 'B', 'C'].map(function (l) { return '<option value="' + l + '"' + (s.level === l ? ' selected' : '') + '>' + l + '</option>'; }).join('') +
        '</select></div>' +
      '<div id="bg-pass-wrap" class="' + (mode === 'pass' ? '' : 'hidden') + '">' +
        '<select id="bg-pass" class="w-full border-2 border-blue-100 rounded-xl px-4 py-2.5 mb-3">' +
          '<option value="通過"' + (s.level === '通過' ? ' selected' : '') + '>通過</option>' +
          '<option value="未通過"' + (s.level === '未通過' ? ' selected' : '') + '>未通過</option>' +
        '</select></div>' +
      '<label class="text-sm font-bold text-slate-500">回饋評語</label>' +
      '<textarea id="bg-comment" rows="2" class="w-full border-2 border-blue-100 rounded-xl px-4 py-2.5 mt-1 mb-4">' + escapeHtml(s.comment) + '</textarea>' +
      '<div class="flex gap-3 mb-3">' +
        '<button onclick="submitBatchGrade(\'退回\')" class="flex-1 py-3 rounded-xl bg-red-100 text-red-600 font-bold hover:bg-red-200">退回重修（此人）</button>' +
        '<button onclick="submitBatchGrade(\'已完成\')" class="flex-1 py-3 rounded-xl btn-primary">' + (bg.index === bg.subs.length - 1 ? '儲存此人評分' : '儲存並前往下一位') + '</button>' +
      '</div>' +
      '<button onclick="confirmApplyBatchGradeToAll()" class="w-full py-3 rounded-xl btn-accent">📋 套用這份評分到全部 ' + bg.subs.length + ' 位學生</button>' +
    '</div>', { wide: true }
  );
}

function switchBatchGradeMode() {
  var mode = document.getElementById('bg-mode').value;
  document.getElementById('bg-score-wrap').className = mode === 'score' ? '' : 'hidden';
  document.getElementById('bg-level-wrap').className = mode === 'level' ? '' : 'hidden';
  document.getElementById('bg-pass-wrap').className = mode === 'pass' ? '' : 'hidden';
}

function batchGradeNav(delta) {
  var bg = BATCH_GRADE;
  var next = bg.index + delta;
  if (next < 0 || next >= bg.subs.length) return;
  bg.index = next;
  renderBatchGradeModal();
}

function readBatchGradeForm() {
  var mode = document.getElementById('bg-mode').value;
  var payload = { comment: document.getElementById('bg-comment').value.trim() };
  if (mode === 'score') payload.score = document.getElementById('bg-score').value === '' ? null : Number(document.getElementById('bg-score').value);
  else if (mode === 'level') { payload.level = document.getElementById('bg-level').value; payload.score = null; }
  else { payload.level = document.getElementById('bg-pass').value; payload.score = null; }
  return payload;
}

// 批改「目前這一位」學生，成功後自動跳到下一位尚未批改的畫面（若已是最後一位則留在原地並提示完成）
function submitBatchGrade(status) {
  var bg = BATCH_GRADE;
  var s = bg.subs[bg.index];
  var form = readBatchGradeForm();
  var payload = Object.assign({ submissionId: s.id, status: status }, form);
  setLoading(true);
  api('gradeSubmission', payload).then(function (res) {
    setLoading(false);
    if (!res.success) return toast(res.message, 'error');
    delete GRADING_CACHE[STATE.currentClass.id];
    s.status = status; s.score = form.score !== undefined ? form.score : null; s.level = form.level || ''; s.comment = form.comment;
    if (bg.index < bg.subs.length - 1) { bg.index++; toast('已儲存，前往下一位', 'success'); renderBatchGradeModal(); }
    else { toast('已儲存！這是最後一位了', 'success'); renderBatchGradeModal(); }
  });
}

// 把目前表單上的評分結果，一次套用給這個任務底下所有已繳交的學生（會覆蓋每個人原本的評分）
function confirmApplyBatchGradeToAll() {

      setLoading(false);

function renderSubmissionPreview(s, taskType) {
  var c = s.content || {};
  if (taskType === 'PHOTO_TEXT') {
    return '<div class="bg-slate-50 rounded-xl p-3">' +
      (c.text ? '<p class="text-sm mb-2 whitespace-pre-wrap">' + escapeHtml(c.text) + '</p>' : '') +
      '<div class="flex flex-wrap gap-2">' + (c.photoFileIds || []).map(function (id) { return '<img src="https://drive.google.com/thumbnail?id=' + id + '&sz=w400" class="w-28 h-28 object-cover rounded-lg border">'; }).join('') + '</div>' +
    '</div>';

  }

function wireStudentClassPicker() {

  api('getAllClassesForStudentWithTasks', STATE.student.studentId).then(function (res) {

      '</button>';
    }).join('');
  });

function loadStudentDashboardData(forceRefresh) {
  var classId = STATE.student.classId;
  var cached = !forceRefresh && STU_DATA_CACHE[classId];
  if (cached) {
    STU_DATA = cached;
    if (!STU_ACTIVE_CAT || !cached.categories.find(function (c) { return c.id === STU_ACTIVE_CAT; })) {
      STU_ACTIVE_CAT = cached.categories[0] ? cached.categories[0].id : null;
    }
    renderStuCatTabs(); renderStuTaskGrid();
    return;
  }
  setLoading(true);
  api('getTasksForStudent', classId, STATE.student.studentId).then(function (res) {
    setLoading(false);
    if (!res.success) return toast(res.message, 'error');
    STU_DATA = res;
    STU_DATA_CACHE[classId] = res;
    if (!STU_ACTIVE_CAT || !res.categories.find(function (c) { return c.id === STU_ACTIVE_CAT; })) {
      STU_ACTIVE_CAT = res.categories[0] ? res.categories[0].id : null;
    }
    renderStuCatTabs(); renderStuTaskGrid();
  });
}

  var el = document.getElementById('stu-cat-tabs');

  }).join('');
}

function renderStuTaskGrid() {
  var el = document.getElementById('stu-task-grid');
  if (!el) return;
  var list = STU_DATA.tasks.filter(function (t) { return t.categoryId === STU_ACTIVE_CAT; }).sort(function (a, b) { return a.order - b.order; });
  if (list.length === 0) { el.innerHTML = '<div class="text-slate-400 col-span-full text-center py-10">此分類目前尚無任務</div>'; return; }
  el.innerHTML = list.map(function (t, idx) {
    var meta = getTaskTypeMeta(t.type);
