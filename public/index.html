<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<meta charset="UTF-8">

<!-- 外部函式庫：Tailwind CSS（含日系大地色調色盤設定）、字型、PDF 轉圖片、QR Code -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind.config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<link rel="stylesheet" href="css/app.css">
</head>
<body class="text-slate-700">
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" class="fixed top-4 left-1/2 -translate-x-1/2 z-[999] flex flex-col gap-2 items-center"></div>

<!--

  pages/    首頁、作品藝廊
  teacher/  教師後台各分頁
  student/  學生登入與儀表板
  tasks/    各種互動任務的學生端畫面（一種任務一個檔案）
-->
<script src="js/core/utils.js"></script>

<script src="js/app.js"></script>
